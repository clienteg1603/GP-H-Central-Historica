name: Aplicar v0.46.5 Home Windows

on:
  push:
    branches:
      - fix-home-windows-v0465
    paths:
      - "tmp_v0465_patch.py"
      - "tmp_v0465_test.py"
      - ".github/workflows/aplicar-v0465-temp.yml"

permissions:
  contents: write

jobs:
  validar-e-aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Guardar baseline v0.46.4
        run: git show origin/main:source/gph_central.py > /tmp/gph_main_v0464.py

      - name: Aplicar patch v0.46.5
        run: python tmp_v0465_patch.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py

      - name: Preparar Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Testar tamanho mínimo e resize estático
        run: xvfb-run -a python tmp_v0465_test.py

      - name: Conferir diff
        run: git diff --check

      - name: Gravar versão validada e limpar temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git rm -f tmp_v0465_patch.py tmp_v0465_test.py .github/workflows/aplicar-v0465-temp.yml
          git commit -m "v0.46.5 Home estável no Windows"
          git push
