name: Extrair Home temporariamente
on:
  push:
    branches: [fix-home-resize-v0464]
    paths:
      - "tmp_extract_home.py"
      - ".github/workflows/extrair-home-temp.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-home-resize-v0464
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tmp_extract_home.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_home_excerpt.txt
          git commit -m "Extrair trechos Home para auditoria"
          git push
