name: Inspecionar Meta em formação
on:
  push:
    branches: [fix-meta-formacao-v0469]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-meta-formacao-v0469
      - name: Mostrar integração Jogar Meta
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py')
          s=p.read_text(encoding='utf-8')
          t=ast.parse(s)
          names=[]
          for node in ast.walk(t):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and 'meta' in node.name.lower():
                  names.append(node.name)
          print('FUNÇÕES META:', sorted(set(names)))
          needle='ainda não pode gerar esta rodada'
          pos=s.find(needle)
          print('POS=',pos)
          if pos>=0:
              start=s.rfind('\n    def ',0,pos)
              end=s.find('\n    def ',pos)
              print(s[start:end if end>=0 else None])
          PY
