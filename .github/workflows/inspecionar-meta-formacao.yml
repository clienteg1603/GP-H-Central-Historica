name: Inspecionar Meta em formação
on:
  push:
    branches: [fix-meta-formacao-v0469]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-meta-formacao-v0469
      - name: Mostrar treinador Meta
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py')
          s=p.read_text(encoding='utf-8')
          t=ast.parse(s)
          wanted={'_meta_examples','_meta_fit_logit','_meta_model_score','_meta_training_records'}
          for node in ast.walk(t):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
                  print('\n===== '+node.name+' =====')
                  print(ast.get_source_segment(s,node))
          PY
