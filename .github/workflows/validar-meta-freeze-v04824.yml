name: Validar Meta Freeze v0.48.24

on:
  push:
    branches: [fix-meta-freeze-all-slots-v04824]

permissions:
  contents: read

jobs:
  validar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testes
        shell: pwsh
        run: |
          cd source
          python -m py_compile gph_meta_freeze_guard.py gph_bootstrap.py gph_version.py
          python -m unittest discover -s tests -v
      - name: Build
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          cd source
          python -m PyInstaller --clean --noconfirm "GP-H_Central.spec"
          if (-not (Test-Path "dist\GP-H Central Historica.exe")) { throw "Build falhou" }
