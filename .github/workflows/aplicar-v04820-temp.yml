name: Aplicar v0.48.20 Home atrasos

on:
  push:
    branches:
      - home-atraso-cabeca-v04820
    paths:
      - "tmp_patch_v04820.py"
      - "tmp_fix_patch_v04820.py"
      - ".github/workflows/aplicar-v04820-temp.yml"

permissions:
  contents: write

jobs:
  validar-e-aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: home-atraso-cabeca-v04820
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Corrigir patch temporário
        run: python tmp_fix_patch_v04820.py

      - name: Aplicar patch v0.48.20
        run: python tmp_patch_v04820.py

      - name: Validar sintaxe e cálculo da cabeça
        shell: bash
        run: |
          python -m py_compile source/gph_central.py source/gph_ui_home.py source/gph_version.py
          PYTHONPATH=source python -m unittest source.tests.test_home_head_delay_v04820 -v

      - name: Validar escopo da mudança
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import subprocess
          src = Path('source/gph_central.py').read_text(encoding='utf-8')
          assert 'delay_card = ttk.Frame(main, style="Card.TFrame"' in src
          assert 'row=1, column=0, columnspan=2, sticky="ew"' in src
          assert '("bicho_p1", "Cabeça · 1º prêmio")' in src
          assert '("bicho", "Bicho · 1º–5º")' in src
          assert 'APP_VERSION = "0.48.20"' in Path('source/gph_version.py').read_text(encoding='utf-8')

          before = subprocess.check_output(
              ['git', 'show', 'origin/main:source/gph_central.py'],
              text=True, encoding='utf-8'
          )
          names = [
              'method_reset_coverage_v1','method_convergencia_g5','method_similarity_day',
              'method_historico_concentrado_v01','generate_historical_concentrated_bundle',
              'generate_centenas_3plus1','centena_31_freeze_state',
              'decision_contextual_evidence','decision_contextual_audit_summary',
              'decision_confidence_calibration','decision_walk_forward','decision_adaptive_context',
              'decision_adaptive_audit_summary','decision_operational_recommendation',
              'decision_operational_audit_summary','meta_shadow_prediction','meta_walk_forward',
              'freeze_meta_snapshot','historical_pulls','number_rankings_for_group','generate_historical_numbers',
          ]
          def sig(text):
              tree = ast.parse(text)
              found = {}
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names:
                      found[node.name] = ast.dump(node, include_attributes=False)
              return found
          a, b = sig(before), sig(src)
          changed = [name for name in names if a.get(name) != b.get(name)]
          if changed:
              raise SystemExit('Cérebro alterado: ' + ', '.join(changed))
          print('Escopo v0.48.20 OK; cérebro protegido.')
          PY

      - name: Smoke visual da Home
        shell: bash
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            rm -rf /tmp/gph-v04820-ui
            GPH_DATA_DIR=/tmp/gph-v04820-ui PYTHONPATH=source xvfb-run -a python - <<'PY'
          import gph_central as g
          g.App._ensure_profile_login = lambda self: True
          app = g.App()
          app.geometry('1600x900')
          app.update_idletasks()
          app.show_home()
          app.update_idletasks()

          texts = []
          def walk(widget):
              try:
                  value = widget.cget('text')
                  if value:
                      texts.append(str(value))
              except Exception:
                  pass
              for child in widget.winfo_children():
                  walk(child)
          walk(app.content)
          assert 'ATRASOS ATUAIS' in texts
          assert 'Bicho · 1º–5º' in texts
          assert 'Cabeça · 1º prêmio' in texts
          assert 'Centena' in texts
          assert 'Dezena' in texts
          app.destroy()
          print('Smoke visual Home v0.48.20 OK')
          PY
          fi

      - name: Conferir diff
        run: git diff --check

      - name: Gravar versão validada e limpar temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tmp_patch_v04820.py tmp_fix_patch_v04820.py .github/workflows/aplicar-v04820-temp.yml
          git add source/gph_central.py source/gph_ui_home.py source/gph_version.py source/DOCUMENTACAO_GP-H.txt source/tests/test_home_head_delay_v04820.py
          git commit -m "v0.48.20: Home com atraso da cabeça em faixa inferior"
          git push origin HEAD:home-atraso-cabeca-v04820
