name: Aplicar painel Reset 3+1 em Jogar v0.36.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v0.36.5.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/scripts/patch_v0365.py

      - name: Validar Python e interface
        run: |
          python -m py_compile source/gph_central.py
          python - <<'PY'
          from pathlib import Path
          import ast

          text = Path('source/gph_central.py').read_text(encoding='utf-8')
          assert 'APP_VERSION = "0.36.5"' in text
          assert 'def play_render_31_state' in text
          assert 'self.play_31_state_card' in text
          assert 'ESTADO DO RESET + 3+1' in text
          assert 'Aplicado: 3×' in text
          assert 'aguardando nova aparição do bicho' in text
          ast.parse(text)
          print('Interface Jogar v0.36.5 OK')
          PY

      - name: Confirmar fórmula oficial preservada
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('source/gph_central.py').read_text(encoding='utf-8')
          assert 'main_dez = segunda["numero"]' in text
          assert 'extra_dez = terceira["numero"]' in text
          assert 'main_dez = principal["numero"]' in text
          assert 'extra_dez = segunda["numero"]' in text
          assert 'freeze_rule": "persistente_ate_reaparicao_do_bicho"' in text
          assert 'generation = self.db.generate_centenas_3plus1' in text
          print('Fórmula Reset + 3+1 preservada')
          PY

      - name: Publicar source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt source/ATUALIZACOES_PROGRAMA_v0.35.txt
          git commit -m "GP-H v0.36.5: estado Reset 3+1 visível em Jogar"
          git push
