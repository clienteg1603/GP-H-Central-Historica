name: Aplicar v0.36.1 multi-horarios 2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/patch-v0.36.1-multi-horarios-2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Aplicar script
        run: python .github/scripts/patch_v0361.py

      - name: Validar
        run: |
          python -m py_compile source/gph_central.py
          grep -q 'APP_VERSION = "0.36.1"' source/gph_central.py
          grep -q 'def play_register_ticket_multi' source/gph_central.py

      - name: Publicar source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git commit -m "GP-H v0.36.1: bilhete em varios horarios"
          git push
