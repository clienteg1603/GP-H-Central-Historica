name: Validar v0.48.1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validar código e testes
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\source"
          python -m py_compile gph_central.py gph_bootstrap.py gph_version.py gph_round_advisor.py gph_updater.py gph_history_lab.py gph_history_ui.py CRIAR_PACOTE_ATUALIZACAO.py
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam" }

      - name: Validar build Windows sem console
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          Set-Location "$env:GITHUB_WORKSPACE\source"
          python -m PyInstaller --clean --noconfirm "GP-H_Updater.spec"
          python -m PyInstaller --clean --noconfirm "GP-H_Central.spec"
          if (-not (Test-Path "dist\GP-H_Updater.exe")) { throw "Updater não gerado" }
          if (-not (Test-Path "dist\GP-H Central Historica.exe")) { throw "Central não gerada" }
          $text = Get-Content "gph_version.py" -Raw
          if ($text -notmatch 'APP_VERSION\s*=\s*"0\.48\.1"') { throw "Versão efetiva incorreta" }
