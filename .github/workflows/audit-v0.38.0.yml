name: Auditoria visual v0.38.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-v0.38.0.yml"
      - ".github/scripts/audit_v0380.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar telas e redundancias
        run: python .github/scripts/audit_v0380.py
