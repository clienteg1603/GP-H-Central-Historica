name: GP-H Meta v0.41.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v0.41.0.yml"
      - ".github/scripts/patch_v0410.py"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar v0.41.0
        run: python .github/scripts/patch_v0410.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py

      - name: Preparar Tk para testes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk

      - name: Testar motor Meta e congelamento prospectivo
        run: |
          python - <<'PY'
          import importlib.util, sys, tempfile, json
          from pathlib import Path

          spec=importlib.util.spec_from_file_location('gph_meta_test',Path('source/gph_central.py'))
          mod=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          Database=mod.Database

          db=Database(Path(tempfile.mkdtemp())/'meta.db')

          def signals_for(groups):
              groups=list(groups)
              return {
                  'Reset Cobertura': {'available':True,'groups':groups[:5],'scores':[90,80,70,60,50]},
                  'Puxada Combinada': {'available':True,'groups':groups[:5],'source_counts':[4,3,3,2,2],'sum_prob':[95,80,70,55,45]},
                  'Similaridade': {'available':True,'groups':groups[:5],'weighted_shares':[60,50,40,30,20]},
              }

          hist={'selected':[
              {'grupo':1,'indication_count':4,'sum_prob':110},
              {'grupo':2,'indication_count':3,'sum_prob':90},
              {'grupo':3,'indication_count':3,'sum_prob':80},
              {'grupo':4,'indication_count':2,'sum_prob':65},
              {'grupo':5,'indication_count':2,'sum_prob':55},
          ]}
          base={'data':'2026-09-08','sorteio':'PT','hora':'14h','prizes':[{'grupo':9},{'grupo':8},{'grupo':7},{'grupo':6},{'grupo':5}]}

          # 1) Vetor de características tem tamanho fixo e distingue convergência.
          x1=db._meta_feature_vector(1,signals_for([1,2,3,4,5]),hist,base)
          x9=db._meta_feature_vector(9,signals_for([1,2,3,4,5]),hist,base)
          assert len(x1)==len(db._meta_feature_names())==20
          assert sum(x1)>sum(x9)

          # 2) Ajuste logístico nativo aprende padrão sintético.
          examples=[]
          for _ in range(40):
              examples.append(([1,1,1]+[0]*17,1,1.0))
              examples.append(([0]*20,0,1.0))
          model=db._meta_fit_logit(examples)
          assert model and db._meta_model_score(model,[1,1,1]+[0]*17) > db._meta_model_score(model,[0]*20)

          # 3) Meta bloqueia pouca amostra.
          db.get_draw=lambda *args: None
          db._meta_training_records=lambda **kwargs: []
          out=db.meta_shadow_prediction({'data':'2026-09-09','sorteio':'PPT','hora':'09h'},base,signals_for([1,2,3,4,5]))
          assert out['available'] is False and out['status']=='AMOSTRA INSUFICIENTE'

          # 4) Com 30 snapshots, produz Top 5 distintos e mantém 25 no ranking.
          records=[]
          for i in range(30):
              groups=[1,2,3,4,5] if i%3 else [1,2,3,4,6]
              records.append({
                  'target_data':f'2026-08-{(i%28)+1:02d}','target_hora':'09h' if i%2==0 else '14h',
                  'signals':signals_for(groups),'historical':hist,'base_draw':base,
                  'result_groups':[1,2,3,20,21],
              })
          db._meta_training_records=lambda **kwargs: records
          db.method_historico_concentrado_v01=lambda *args,**kwargs: hist
          target={'data':'2026-09-09','sorteio':'PPT','hora':'09h'}
          out=db.meta_shadow_prediction(target,base,signals_for([1,2,3,4,5]))
          assert out['available'] is True
          assert len(out['groups'])==5 and len(set(out['groups']))==5 and len(out['ranking'])==25
          assert 1 in out['groups'] and 2 in out['groups']
          assert out['model_version']=='META_LOGIT_NATIVE_V1'

          # 5) Primeiro congelamento é canônico e o resultado existente bloqueia backfill.
          with db.connect() as c:
              cur=c.execute('''
                  INSERT INTO decision_snapshots
                  (base_data,base_sorteio,base_hora,target_data,target_sorteio,target_hora,signals_json)
                  VALUES(?,?,?,?,?,?,?)
              ''',('2026-09-08','PT','14h','2026-09-09','PPT','09h',json.dumps(signals_for([1,2,3,4,5]))))
              row=c.execute('SELECT * FROM decision_snapshots WHERE id=?',(cur.lastrowid,)).fetchone()
          snap=db._decision_row_to_dict(row)
          def draw_lookup(d,s,h):
              if (d,s,h)==('2026-09-08','PT','14h'): return base
              return None
          db.get_draw=draw_lookup
          snap,created=db.freeze_meta_snapshot(snap)
          assert created is True and snap['meta']['available'] is True
          first=snap['meta_json']
          snap2,created2=db.freeze_meta_snapshot(snap)
          assert created2 is False and snap2['meta_json']==first

          # 6) Auditoria do Meta mede cobertura e baseline aleatório.
          audit=Database._meta_audit_payload(snap['meta'],[1,2,7,8,9])
          assert audit['available'] is True
          assert audit['coverage_hits']>=2
          assert abs(audit['random_expected']-1.0)<1e-9

          print('TESTES GP-H META v0.41.0 OK')
          PY

      - name: Validar invariantes
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          t=Path('source/gph_central.py').read_text(encoding='utf-8')
          ast.parse(t)
          assert 'APP_VERSION = "0.41.0"' in t
          assert 'def freeze_meta_snapshot(' in t
          assert 'def meta_shadow_prediction(' in t
          assert 'def _decision_build_meta(' in t
          assert 'META_LOGIT_NATIVE_V1' in t
          assert 'meta_audit_json' in t
          assert 'O Meta permanece 100% em sombra' in t
          d=Path('source/DOCUMENTACAO_GP-H.txt').read_text(encoding='utf-8')
          assert d.startswith('REVISÃO v0.41.0')
          print('VALIDAÇÃO ESTRUTURAL v0.41.0 OK')
          PY

      - name: Registrar v0.41.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --stat
          git commit -m "v0.41.0 GP-H Meta v0.1 em sombra"
          git push origin main
