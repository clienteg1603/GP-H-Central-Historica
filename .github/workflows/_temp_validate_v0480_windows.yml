name: TEMP valida v0.48.0 Windows
on:
  push:
    branches: [fix-v0480-windows-sqlite-lock]
permissions:
  contents: read
jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compilar
        shell: pwsh
        run: |
          Set-Location source
          python -m py_compile gph_central.py gph_updater.py gph_history_lab.py gph_history_ui.py CRIAR_PACOTE_ATUALIZACAO.py
      - name: Testar laboratório e interface
        shell: pwsh
        run: |
          Set-Location source
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam" }
