name: Validar GP-H Meta jogável v0.46.8 v2

on:
  push:
    branches:
      - meta-jogavel-v0468

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: meta-jogavel-v0468
          fetch-depth: 0

      - name: Guardar baseline v0.46.7
        run: cp source/gph_central.py /tmp/gph_before.py

      - name: Remover patch opcional do Sobre
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/scripts/apply_meta_v0468.py')
          s=p.read_text(encoding='utf-8')
          start=s.find('# Sobre/novidades.')
          end=s.find("\np.write_text(s, encoding='utf-8')", start)
          if start >= 0 and end > start:
              s=s[:start] + s[end+1:]
          p.write_text(s, encoding='utf-8')

      - name: Aplicar v0.46.8
        run: python .github/scripts/apply_meta_v0468.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py

      - name: Proteger cérebro e métodos existentes
        shell: python
        run: |
          import ast
          from pathlib import Path
          before=ast.parse(Path('/tmp/gph_before.py').read_text(encoding='utf-8'))
          after=ast.parse(Path('source/gph_central.py').read_text(encoding='utf-8'))
          protected={
              '_meta_feature_names','_meta_feature_vector','_meta_examples',
              '_meta_fit_logit','_meta_model_score','_meta_training_records',
              'meta_shadow_prediction','meta_walk_forward','method_reset_coverage_v1',
              'method_convergencia_g5','method_similarity_day','method_historico_concentrado_v01',
              'generate_centenas_3plus1','centena_31_freeze_state',
              'decision_adaptive_context','decision_operational_recommendation',
          }
          def methods(tree):
              out={}
              for node in ast.walk(tree):
                  if isinstance(node,ast.ClassDef) and node.name=='Database':
                      for item in node.body:
                          if isinstance(item,(ast.FunctionDef,ast.AsyncFunctionDef)):
                              out[item.name]=ast.dump(item,include_attributes=False)
              return out
          a,b=methods(before),methods(after)
          missing=sorted(x for x in protected if x not in a or x not in b)
          changed=sorted(x for x in protected if x in a and x in b and a[x]!=b[x])
          if missing or changed:
              raise SystemExit(f'Proteção falhou. Ausentes={missing} Alterados={changed}')
          print(f'OK: {len(protected)} métodos sensíveis AST-idênticos')

      - name: Testar matemática Meta 2 para 1
        shell: python
        env:
          GPH_DATA_DIR: /tmp/gph_meta_test_data
        run: |
          import importlib.util,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('gph_meta_test',Path('source/gph_central.py'))
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          class Dummy:
              distribute_game_counts=mod.Database.distribute_game_counts
              generate_centenas_meta_21=mod.Database.generate_centenas_meta_21
              def latest_operational_draw(self): return {'data':'2026-09-09','sorteio':'PT','hora':'14:00','prizes':[]}
              def number_rankings_for_group(self,group,kind='Dezena',scope='1º–5º'):
                  start=(int(group)-1)*4+1
                  return [{'numero':f'{(start+i)%100:02d}','ocorrencias':100-i,'ultima':'2026-09-01'} for i in range(4)]
              def centena_31_freeze_state(self,group,principal_dezena,previous_draw=None):
                  return {'frozen':False,'trigger':None,'released_by':None}
              def centena_rankings_for_dezena(self,group,dezena,scope='1º–5º'):
                  return [{'numero':f'{i}{str(dezena).zfill(2)}','ocorrencias':10-i,'ultima':'2026-09-01'} for i in range(10)]
          d=Dummy(); base=d.latest_operational_draw()
          g=d.generate_centenas_meta_21([1,2,3],10,base)
          assert g['counts']=={1:4,2:3,3:3},g['counts']
          assert [(a['main_count'],a['extra_count']) for a in g['animals']]==[(3,1),(2,1),(2,1)]
          g=d.generate_centenas_meta_21([1,2,3],15,base)
          assert g['counts']=={1:5,2:5,3:5}
          assert [(a['main_count'],a['extra_count']) for a in g['animals']]==[(3,2)]*3
          for total,pair in {4:(3,1),5:(3,2),6:(4,2),8:(5,3),9:(6,3)}.items():
              z=d.generate_centenas_meta_21([1],total,base); a=z['animals'][0]
              assert (a['main_count'],a['extra_count'])==pair,(total,a,pair)
          z=d.generate_centenas_meta_21([1,2,3],23,base)
          assert z['counts']=={1:8,2:8,3:7}
          assert [(a['main_count'],a['extra_count']) for a in z['animals']]==[(5,3),(5,3),(5,2)]
          try: d.generate_centenas_meta_21([1],16,base)
          except ValueError as exc: assert '15 Centenas por bicho' in str(exc)
          else: raise AssertionError('limite 2:1 não protegido')
          print('OK: 3+1, 3+2, 4+2, 5+3, 6+3 e sobras por ranking')

      - name: Validar todas as modalidades Meta
        shell: python
        run: |
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8')
          assert 'APP_VERSION = "0.46.8"' in s
          assert s.count('"★ META • GP-H Meta v0.1"') >= 6
          for token in (
              'generate_centenas_meta_21','Meta 2:1','Meta • Fechamento',
              'META • ADAPTATIVO','freeze_meta_snapshot(snapshot=snapshot)',
              'kind in GROUP_COMBO_SIZES or kind in PASSE_MODALITIES',
              'kind in DEZENA_COMBO_SIZES or kind in INVERTED_MODALITIES or kind == "Dezena"',
              '"Milhar/Centena"',
          ): assert token in s,token
          d=Path('source/DOCUMENTACAO_GP-H.txt').read_text(encoding='utf-8')
          assert d.startswith('REVISÃO v0.46.8')
          print('OK: Grupo, Dupla/Terno/Quadra/Quina, Fechamento, Passe, Dezena/Duque/Terno, invertidas, Centena e Milhar')

      - name: Conferir diff
        run: git diff --check

      - name: Limpar temporários e publicar branch validada
        shell: bash
        run: |
          rm -f .github/scripts/apply_meta_v0468.py
          rm -f .github/workflows/testar-meta-v0468.yml
          rm -f .github/workflows/testar-meta-v0468-v2.yml
          find source -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find source -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "GP-H Central Histórica v0.46.8 — Meta jogável em todas as modalidades"
          git push origin HEAD:meta-jogavel-v0468
