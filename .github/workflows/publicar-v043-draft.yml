name: Publicar rascunho v0.43.0

on:
  push:
    paths:
      - '.github/workflows/publicar-v043-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar Release v0.43.0-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/385117939" \
            -F draft=false \
            -F prerelease=true \
            -f tag_name='v0.43.0-test' \
            -f name='GP-H Central Histórica v0.43.0' >/dev/null
          gh release view 'v0.43.0-test' --repo "$GITHUB_REPOSITORY"
