name: TEMP inspect dry v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Extract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8'); t=ast.parse(s)
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef) and node.name in {'generate_dry_day_numbers','dry_day_groups','method_dry_day'}:
              print(f'===== {node.name} {node.lineno}-{node.end_lineno} =====')
              print(ast.get_source_segment(s,node) or '')
          PY
