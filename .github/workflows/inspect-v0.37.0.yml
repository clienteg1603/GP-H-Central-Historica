name: Inspecionar Decisao v0.37.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-v0.37.0.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar funções de auditoria
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('source/gph_central.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          names=['def _decision_audited_rows', 'def _decision_performance_from_rows', 'def _decision_signal_payload']
          for name in names:
              for i,line in enumerate(lines):
                  if name in line:
                      print('\n===', name, 'linha', i+1, '===')
                      end=min(len(lines), i+120)
                      for j in range(i,end):
                          if j > i and lines[j].startswith('    def ') and j > i+2:
                              break
                          print(f'{j+1}: {lines[j]}')
                      break
          PY
