name: Aplicar v0.46.6 Updater Resiliente

on:
  push:
    branches:
      - fix-updater-retry-v0466
    paths:
      - "tmp_v0466_patch.py"
      - "tmp_v0466_test.py"
      - ".github/workflows/aplicar-v0466-temp.yml"

permissions:
  contents: write

jobs:
  validar-e-aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Guardar baseline v0.46.5
        run: cp source/gph_central.py /tmp/gph_main_v0465.py

      - name: Aplicar patch v0.46.6
        run: python tmp_v0466_patch.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py source/gph_updater.py

      - name: Testar retry e fallback
        run: python tmp_v0466_test.py

      - name: Conferir diff
        run: git diff --check

      - name: Gravar versão validada e limpar temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git rm -f tmp_v0466_patch.py tmp_v0466_test.py .github/workflows/aplicar-v0466-temp.yml
          git commit -m "v0.46.6 Atualizador resiliente a HTTP 503"
          git push
