name: Inspecionar Gerador v0.36.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-v0.36.6.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar ocorrencias relevantes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('source/gph_central.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=['Gerador','generator','show_generator','gerador']
          hits=[]
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles):
                  hits.append(i)
          print('HITS', hits)
          for i in hits:
              a=max(1,i-4); b=min(len(lines),i+5)
              print(f'--- {a}-{b} ---')
              for j in range(a,b+1):
                  print(f'{j}: {lines[j-1]}')
          PY
