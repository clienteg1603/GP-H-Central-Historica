name: Rodar correção Meta em formação v0.46.9
on:
  push:
    branches:
      - fix-meta-formacao-v0469
permissions:
  contents: write
jobs:
  aplicar:
    if: contains(github.event.head_commit.message, 'Executa patch Meta formação v0.46.9')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-meta-formacao-v0469
          fetch-depth: 0
      - name: Preparar ambiente
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: Aplicar e validar
        env:
          GPH_DATA_DIR: /tmp/gph_meta_formacao_test
        run: python .github/scripts/apply_meta_formacao_v0469.py
      - name: Conferir diff
        run: git diff --check && git status --short
      - name: Limpar temporários e salvar
        run: |
          rm -rf source/__pycache__
          git rm -f .github/workflows/inspecionar-meta-formacao.yml .github/workflows/aplicar-meta-formacao-v0469.yml .github/workflows/rodar-meta-formacao-v0469.yml .github/scripts/apply_meta_formacao_v0469.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git commit -m "v0.46.9 Meta jogável em formação"
          git push origin HEAD:fix-meta-formacao-v0469
