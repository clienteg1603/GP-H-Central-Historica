name: TEMP inspect v0.48.1
on:
  push:
    branches: [feat-next-round-recommendation-v0481]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect play UI and history API
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py'); text=p.read_text(encoding='utf-8'); lines=text.splitlines(); tree=ast.parse(text)
          print('LINES',len(lines))
          print('=== METHODS NAMES ===')
          for n in ast.walk(tree):
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  low=n.name.lower()
                  src='\n'.join(lines[n.lineno-1:n.end_lineno])
                  if any(k in low for k in ('play','jog','apost','bet')) or any(s in src for s in ('Nova aposta','Método Manual','GERAR JOGOS','Gerar jogos','GP-H Meta v0.2')):
                      print(n.lineno,n.end_lineno,n.name)
          print('=== LITERAL NOVA APOSTA CONTEXT ===')
          for i,l in enumerate(lines,1):
              if 'Nova aposta' in l or 'Método Manual' in l or 'GERAR JOGOS' in l:
                  print('\n--- around',i,'---')
                  print('\n'.join(f'{j+1}: {lines[j]}' for j in range(max(0,i-50),min(len(lines),i+100))))
          print('=== SELECTED METHODS ===')
          wanted=[]
          for n in ast.walk(tree):
              if isinstance(n,ast.FunctionDef):
                  low=n.name.lower(); src='\n'.join(lines[n.lineno-1:n.end_lineno])
                  if any(k in low for k in ('show_play','play_','_play','jogo','aposta')) or 'Nova aposta' in src:
                      if n.end_lineno-n.lineno < 700:
                          wanted.append(n)
          for n in wanted:
              print('\n====',n.name,n.lineno,n.end_lineno,'====')
              print('\n'.join(lines[n.lineno-1:n.end_lineno]))
          PY
          echo '=== HISTORY LAB PUBLIC API ==='
          grep -nE '^def |^class |^PROTOCOL|^SELECTORS|^SCOPES|^LAW|^HIER|^FULL|^FREQ|^GLOBAL|^TERN_' source/gph_history_lab.py
