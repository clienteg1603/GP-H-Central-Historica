name: TEMP fix editor v0.48.2

on:
  push:
    branches:
      - feat-round-advisor-all-methods-v0482

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir e autoclean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('source/gph_round_advisor.py')
          t=p.read_text(encoding='utf-8')
          old='''def _generation_rows_for_edit(generation):\n    if not generation:\n        return None, []\n    if generation.get("historical_concentrated"):\n        for sub in generation.get("bundle_generations") or []:\n            if sub.get("kind") == "Terno de Grupo":\n                return "Terno de Grupo", list(sub.get("rows") or [])\n    return str(generation.get("kind") or ""), list(generation.get("rows") or [])\n'''
          new='''def _generation_rows_for_edit(generation):\n    if not generation:\n        return None, []\n    if generation.get("historical_concentrated"):\n        # A recomendação v0.48.2 configura o Fechamento Concentrado somente\n        # com Ternos; portanto as linhas visíveis desse bundle são editadas\n        # como Terno de Grupo, sem depender de estrutura interna do bundle.\n        return "Terno de Grupo", list(generation.get("rows") or [])\n    return str(generation.get("kind") or ""), list(generation.get("rows") or [])\n'''
          if old not in t:
              raise SystemExit('função esperada não encontrada')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_fix_editor_v0482.yml
          git add source/gph_round_advisor.py
          git diff --cached --check
          git commit -m "v0.48.2 preserva edição do Terno Concentrado"
          git push
