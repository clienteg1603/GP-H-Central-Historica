name: GP-H correção técnica v0.42.1

on:
  push:
    paths:
      - '.github/workflows/patch-v0.42.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar v0.42.1
        run: python .github/scripts/patch_v0421.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py

      - name: Testar processo isolado no Windows
        run: python .github/scripts/test_v0421_mp.py

      - name: Validar invariantes
        shell: pwsh
        run: |
          $t = Get-Content source/gph_central.py -Raw -Encoding UTF8
          if ($t -notmatch 'APP_VERSION = "0.42.1"') { throw 'Versão incorreta' }
          if ($t -notmatch 'target=_meta_walk_forward_process_worker') { throw 'Worker multiprocess ausente' }
          if ($t -match 'threading\.Thread\(target=worker,daemon=True,name="GPH-MetaWalkForward"\)') { throw 'Thread antiga do Meta ainda presente' }
          if ($t -notmatch 'mp\.freeze_support\(\)') { throw 'freeze_support ausente' }
          $d = Get-Content source/DOCUMENTACAO_GP-H.txt -Raw -Encoding UTF8
          if (-not $d.StartsWith('REVISÃO v0.42.1')) { throw 'Documentação não atualizada' }
          Write-Host 'VALIDAÇÃO v0.42.1 OK'

      - name: Registrar v0.42.1
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --stat
          git commit -m "v0.42.1 isolar Walk-Forward Meta da interface"
          git push origin main
