name: Aplicar ajuste v0.35.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aplicar-ajuste-v0.35.1.yml"

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar v0.35.1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('source/gph_central.py')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('GP-H Central Histórica v0.35.0\nPesquisa', 'GP-H Central Histórica v0.35.1\nPesquisa'),
              ('APP_VERSION = "0.35.0"', 'APP_VERSION = "0.35.1"'),
              ('# Ao buscar/atualizar resultados, relê aproximadamente um mês para absorver\n# resultados ausentes e correções tardias publicadas pela fonte.\nWEB_RESULT_RECHECK_DAYS = 30',
               '# Ao buscar/atualizar resultados, relê os últimos 7 dias para absorver\n# resultados ausentes e correções recentes publicadas pela fonte.\nWEB_RESULT_RECHECK_DAYS = 7'),
              ('# O último mês é sempre relido para absorver resultados ausentes e\n                # correções tardias do site. Datas mais antigas já presentes são puladas.',
               '# Os últimos 7 dias são sempre relidos para absorver resultados ausentes e\n                # correções recentes do site. Datas mais antigas já presentes são puladas.'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Trecho esperado não encontrado em gph_central.py: {old[:80]}')
              s = s.replace(old, new, 1)

          changelog_old = '            "• v0.35.0 — Laboratório Sombra visível, coleta prospectiva automática após novos resultados e painel separado para Puxadas/Seca 1º.\\n"'
          changelog_new = ('            "• v0.35.1 — Busca/atualização de resultados passa a reler somente os últimos 7 dias, em vez de 30.\\n"\n'
                           '            "• v0.35.0 — Laboratório Sombra visível, coleta prospectiva automática após novos resultados e painel separado para Puxadas/Seca 1º.\\n"')
          if changelog_old in s:
              s = s.replace(changelog_old, changelog_new, 1)

          p.write_text(s, encoding='utf-8')

          # Mantém utilitários e documentação coerentes com a versão atual.
          bat = Path('source/GERAR_EXE_WINDOWS.bat')
          if bat.exists():
              t = bat.read_text(encoding='utf-8', errors='replace').replace('v0.35.0', 'v0.35.1')
              bat.write_text(t, encoding='utf-8')

          pkg = Path('source/CRIAR_PACOTE_ATUALIZACAO.py')
          if pkg.exists():
              t = pkg.read_text(encoding='utf-8').replace('--version 0.35.0', '--version 0.35.1', 1)
              pkg.write_text(t, encoding='utf-8')

          doc = Path('source/DOCUMENTACAO_GP-H.txt')
          if doc.exists():
              t = doc.read_text(encoding='utf-8')
              note = ('REVISÃO v0.35.1 — JANELA DE ATUALIZAÇÃO DE RESULTADOS\n'
                      '- Ao buscar/atualizar resultados, a Central relê os últimos 7 dias em vez de 30.\n'
                      '- A mudança reduz trabalho de rede sem alterar métodos, fórmulas ou histórico.\n\n')
              if not t.startswith('REVISÃO v0.35.1'):
                  t = note + t
              t = t.replace('VERSÃO ATUAL: v0.35.0', 'VERSÃO ATUAL: v0.35.1', 1)
              doc.write_text(t, encoding='utf-8')

          upd = Path('source/ATUALIZACOES_PROGRAMA_v0.35.txt')
          if upd.exists():
              t = upd.read_text(encoding='utf-8')
              t = t.replace('GP-H CENTRAL HISTÓRICA v0.35.0 — ATUALIZAÇÕES DO PROGRAMA',
                            'GP-H CENTRAL HISTÓRICA v0.35.1 — ATUALIZAÇÕES DO PROGRAMA', 1)
              marker = 'Novidades v0.35.0:'
              note = ('Novidades v0.35.1:\n'
                      '- Busca/atualização de resultados passa a reler os últimos 7 dias em vez de 30.\n'
                      '- Nenhum método, fórmula ou dado histórico foi alterado.\n\n')
              if 'Novidades v0.35.1:' not in t and marker in t:
                  t = t.replace(marker, note + marker, 1)
              upd.write_text(t, encoding='utf-8')
          PY

          python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py

      - name: Publicar alteração e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          git rm .github/workflows/aplicar-ajuste-v0.35.1.yml
          git commit -m "v0.35.1: reduz janela de atualização de resultados para 7 dias"
          git push
