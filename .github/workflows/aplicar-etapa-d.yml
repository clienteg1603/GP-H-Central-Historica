name: Aplicar Etapa D v0.45.0

on:
  push:
    branches:
      - main
    paths:
      - "tmp_stage_d_patch.py"
      - "tmp_stage_d_test.py"
      - ".github/workflows/aplicar-etapa-d.yml"

permissions:
  contents: write

jobs:
  aplicar-etapa-d:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Aplicar patch da Etapa D
        run: python tmp_stage_d_patch.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py

      - name: Teste sintético da Recomendação Operacional
        run: python tmp_stage_d_test.py

      - name: Conferir diff
        run: git diff --check

      - name: Publicar código da v0.45.0
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --quiet && { echo "Nenhuma alteração produzida"; exit 1; }
          git commit -m "v0.45.0 Etapa D Recomendacao Operacional"
          git push
