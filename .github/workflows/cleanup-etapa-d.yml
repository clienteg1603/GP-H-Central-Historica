name: Limpar temporários Etapa D

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-etapa-d.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Remover arquivos temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tmp_stage_d_patch.py tmp_stage_d_test.py source/.build_v0.45.0 .github/workflows/aplicar-etapa-d.yml .github/workflows/cleanup-etapa-d.yml
          git commit -m "Limpar temporarios Etapa D"
          git push
