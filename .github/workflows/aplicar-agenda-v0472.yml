name: Aplicar agenda semanal v0.47.2
on:
  push:
    branches: [fix-agenda-semanal-v0472]
permissions:
  contents: write
jobs:
  aplicar:
    if: ${{ !contains(github.event.head_commit.message, '[agenda-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-agenda-semanal-v0472
          fetch-depth: 0
      - name: Aguardar mapas temporários e alinhar branch
        run: |
          sleep 20
          git fetch origin fix-agenda-semanal-v0472
          git reset --hard origin/fix-agenda-semanal-v0472
      - name: Guardar baseline
        run: cp source/gph_central.py /tmp/gph_before_agenda_v0472.py
      - name: Aplicar agenda
        run: python _temp_patch_agenda_v0472.py
      - name: Validar sintaxe e calendário
        run: |
          python -m py_compile source/gph_central.py
          python _temp_test_agenda_v0472.py
      - name: Conferir alterações
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Limpar temporários e salvar versão validada
        run: |
          rm -rf source/__pycache__ __pycache__
          git rm -f --ignore-unmatch \
            .github/workflows/mapear-agenda-v0472.yml \
            .github/workflows/mapear-agenda-target-v0472.yml \
            .github/workflows/aplicar-agenda-v0472.yml \
            _agenda_excerpt.txt _agenda_targeted.txt \
            _temp_patch_agenda_v0472.py _temp_test_agenda_v0472.py
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[agenda-final] v0.47.2 Agenda semanal por dia'
          git push origin HEAD:fix-agenda-semanal-v0472
