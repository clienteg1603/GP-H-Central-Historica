name: Aplicar updater robusto v0.47.1
on:
  push:
    branches: [fix-updater-fallback-v0471]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-updater-fallback-v0471
          fetch-depth: 0
      - name: Preparar ambiente de teste
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
      - name: Guardar baseline
        run: cp source/gph_central.py /tmp/gph_v0470_before.py
      - name: Aplicar correção
        run: python _temp_patch_v0471.py
      - name: Validar Python e fallback
        run: |
          python -m py_compile source/gph_central.py
          python _temp_test_v0471.py
      - name: Conferir diff
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Limpar temporários e salvar versão validada
        run: |
          rm -rf source/__pycache__ __pycache__
          git rm .github/workflows/inspecionar-updater-v0471.yml _temp_patch_v0471.py _temp_test_v0471.py
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v0.47.1 Atualizador com fallback independente'
          git push origin HEAD:fix-updater-fallback-v0471
