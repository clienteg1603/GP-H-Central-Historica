name: Inspecionar updater v0.47.1
on:
  push:
    branches: [fix-updater-fallback-v0471]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-updater-fallback-v0471
      - name: Mapear atualizador
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py')
          s=p.read_text(encoding='utf-8')
          t=ast.parse(s)
          needles=('update_manifest','program_update','atualiza','manifest','download','http','urlopen','mirror','retry','server')
          print('=== FUNCOES RELEVANTES ===')
          for node in ast.walk(t):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  seg=ast.get_source_segment(s,node) or ''
                  low=(node.name+' '+seg[:18000]).lower()
                  if any(k in low for k in needles) and any(k in low for k in ('update_manifest','program_update','atualiza','manifest')):
                      print(f'\n===== {node.name} L{node.lineno} =====')
                      print(seg[:22000])
          print('\n=== LINHAS DE RETRY/HTTP/MANIFEST ===')
          for i,line in enumerate(s.splitlines(),1):
              low=line.lower()
              if any(k in low for k in ('update_manifest','http error','httperror','urlopen','retry','mirror','backend.max','não foi possível verificar','nao foi possivel verificar')):
                  print(f'{i}: {line[:320]}')
          PY
