name: Auditoria Decisao v0.40.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-decision-v0.40.0.yml"
      - ".github/scripts/audit_decision_v0400.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear Decisao atual
        run: python .github/scripts/audit_decision_v0400.py
