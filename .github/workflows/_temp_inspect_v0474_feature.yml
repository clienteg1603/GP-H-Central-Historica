name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Extrair funções relevantes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py')
          s=p.read_text(encoding='utf-8')
          t=ast.parse(s)
          wanted={
            'number_rankings_for_group','historical_number_rankings_for_groups',
            'generate_group_combinations','generate_passe_combinations',
            'generate_historical_concentrated_bundle','generate_historical_concentrated_game',
            'generate_centenas_3plus1','generate_historical_number_suggestions',
            'distribute_game_counts','_generate_play_meta_ranked','_generate_play_puxada',
            '_generate_play_similaridade','_generate_play_historico_concentrado',
            '_generate_play_reset_3plus1','generate_play_suggestions',
            '_meta_feature_names','_meta_feature_vector','_meta_train_model','meta_shadow_prediction',
            '_meta_generation_context','_reset_reference_extraction'
          }
          for node in ast.walk(t):
            if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
              print(f'\n===== {node.name} L{node.lineno}-{getattr(node,"end_lineno",0)} =====')
              print(ast.get_source_segment(s,node) or '')
          print('\n===== SELECTOR/METHOD STRINGS =====')
          for i,line in enumerate(s.splitlines(),1):
            if any(k in line for k in ('Reset + 3+1','GP-H Meta v0.1','Puxada Combinada','Similaridade','Histórico Concentrado')) and 20000 < i < 25000:
              print(f'{i}: {line}')
          PY
