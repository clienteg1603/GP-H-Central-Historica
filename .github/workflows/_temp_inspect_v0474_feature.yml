name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Listar nomes dos geradores
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8'); t=ast.parse(s)
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef):
              n=node.name.lower()
              if 'generate' in n or ('play' in n and any(k in n for k in ('suggest','strategy','method','meta','pux','sim','histor'))):
                print(f'{node.name} L{node.lineno}-{node.end_lineno}')
          PY
