name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Extrair UI e controles Jogar
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8'); t=ast.parse(s)
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef):
              n=node.name.lower()
              if n in {'show_play','play_method_changed','play_kind_changed','play_update_method_controls','play_refresh_method_controls','play_on_method_changed','play_on_kind_changed'} or ('play' in n and ('method' in n or 'kind' in n) and node.lineno>15000):
                print(f'\n===== {node.name} L{node.lineno}-{node.end_lineno} =====')
                print(ast.get_source_segment(s,node) or '')
          PY
