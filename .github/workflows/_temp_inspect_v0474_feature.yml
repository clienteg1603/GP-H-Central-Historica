name: TEMP inspeciona Meta v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Localizar versões e rótulos Meta
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(s,1):
            low=line.lower()
            if ('gp-h meta' in low or 'model_version' in low or 'meta_model' in low or 'meta v0' in low) and i < 22000:
              print(f'{i}: {line}')
          PY
