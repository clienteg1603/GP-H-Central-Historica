name: TEMP teste Tabela 1 no Meta v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Preparar Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          python -m pip install -q numpy
      - name: Rodar walk-forward Meta 20 vs Meta + Tabela 1
        run: python _temp_meta_table1_admission.py
