name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Extrair helpers Meta
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8'); t=ast.parse(s)
          wanted={'_decision_signal_payload','_meta_model_score','get_draw','_draws_in_order','method_reset_coverage_v1','method_convergencia_g5','method_similarity_day','method_historico_concentrado_v01'}
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef) and node.name in wanted:
              print(f'\n===== {node.name} args={[a.arg for a in node.args.args]} L{node.lineno}-{node.end_lineno} =====')
              if node.name in {'_decision_signal_payload','_meta_model_score'}: print(ast.get_source_segment(s,node) or '')
          for node in t.body:
            if isinstance(node,ast.ClassDef) and node.name=='Database':
              for fn in node.body:
                if isinstance(fn,ast.FunctionDef) and fn.name=='__init__':
                  print(f'\n===== Database.__init__ =====\n{ast.get_source_segment(s,fn) or ""}')
          PY
