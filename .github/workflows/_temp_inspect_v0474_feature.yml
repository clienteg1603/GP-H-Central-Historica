name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Mapear Meta e inserção
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8'); t=ast.parse(s)
          print('=== FUNÇÕES DATABASE/META/DECISION/SNAPSHOT/IMPORT ===')
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef):
              n=node.name.lower()
              if any(k in n for k in ('meta','decision','snapshot','result','draw','upsert','insert','import','manual')):
                args=[a.arg for a in node.args.args]
                print(f'{node.name} L{node.lineno}-{node.end_lineno} args={args}')
          print('\n=== CONSTRUTORES ===')
          for node in ast.walk(t):
            if isinstance(node,ast.ClassDef) and node.name in ('Database','GPApp'):
              for fn in node.body:
                if isinstance(fn,ast.FunctionDef) and fn.name=='__init__':
                  print(node.name, [a.arg for a in fn.args.args], fn.lineno, fn.end_lineno)
          PY
