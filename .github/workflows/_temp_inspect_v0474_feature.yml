name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Localizar controles Jogar
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('source/gph_central.py').read_text(encoding='utf-8').splitlines()
          keys=('play_meta_animals','play_hc_base_animals','play_method =','play_method.set','play_method.configure','Método','Quantidade de bichos')
          hits=[]
          for i,line in enumerate(lines):
            if any(k in line for k in keys) and 15000 <= i+1 <= 20000:
              hits.append(i)
          seen=set()
          for i in hits:
            a=max(0,i-8); b=min(len(lines),i+13)
            key=(a,b)
            if key in seen: continue
            seen.add(key)
            print(f'\n===== L{a+1}-{b} =====')
            for j in range(a,b): print(f'{j+1}: {lines[j]}')
          PY
