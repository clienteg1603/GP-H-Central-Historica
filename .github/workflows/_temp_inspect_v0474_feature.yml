name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Extrair inserção e sinais Meta
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8'); t=ast.parse(s)
          wanted={'upsert_rows','build_decision_reading','_meta_feature_vector','_meta_fit_logit','_meta_examples'}
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef) and node.name in wanted:
              print(f'\n===== {node.name} L{node.lineno}-{node.end_lineno} =====')
              print(ast.get_source_segment(s,node) or '')
          for node in t.body:
            if isinstance(node,ast.ClassDef) and node.name in {'PrizeRow','ResultRow'}:
              print(f'\n===== CLASS {node.name} =====')
              print(ast.get_source_segment(s,node) or '')
          PY
