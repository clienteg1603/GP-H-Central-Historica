name: TEMP inspeciona lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
      - name: Extrair integração da tela Jogar
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8'); t=ast.parse(s)
          wanted={
            'generate_historical_number_suggestions',
            '_generate_play_meta_ranked','_generate_play_puxada','_generate_play_similaridade',
            '_generate_play_historico_concentrado','_generate_play_reset_3plus1',
            'generate_play_suggestions','_meta_generation_context'
          }
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef) and node.name in wanted:
              seg=ast.get_source_segment(s,node) or ''
              print(f'\n===== {node.name} L{node.lineno}-{node.end_lineno} ({len(seg)} chars) =====')
              print(seg)
          PY
