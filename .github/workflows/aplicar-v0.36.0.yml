name: Aplicar evolução v0.36.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aplicar-v0.36.0.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar v0.36.0
        shell: bash
        run: |
          python tools/apply_v0_36_0.py
          python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py

      - name: Validar política de interface
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('source/gph_central.py')
          text = p.read_text(encoding='utf-8')
          ast.parse(text)
          checks = {
              'v0.36.0': 'APP_VERSION = "0.36.0"' in text,
              'Decisão única': 'def _build_shadow_lab_section(self, body):' in text,
              'Sem Laboratório no menu': '("Laboratório", self.show_shadow_lab_page' not in text,
              'Rolamento global': 'def _install_smart_scroll_policy(self):' in text,
              'Pesquisa rolável': '_make_scrollable_page_body(self.content, "search")' in text,
              'Resultados roláveis': '_make_scrollable_page_body(self.content, "results")' in text,
              'Estatísticas roláveis': '_make_scrollable_page_body(self.content, "statistics")' in text,
              'Puxadas roláveis': '_make_scrollable_page_body(self.content, "pulls")' in text,
              'Métodos roláveis': '_make_scrollable_page_body(self.content, "methods")' in text,
              'Gerador rolável': '_make_scrollable_page_body(self.content, "generator")' in text,
          }
          for name, ok in checks.items():
              print(f'{name}: {"OK" if ok else "FALHA"}')
              if not ok:
                  raise SystemExit(1)
          PY

      - name: Publicar alteração e remover temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aplicar-v0.36.0.yml
          git rm tools/apply_v0_36_0.py
          git rm .github/workflows/auditar-interface-v0.36.yml
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt source/ATUALIZACOES_PROGRAMA_v0.35.txt source/GERAR_EXE_WINDOWS.bat
          git commit -m "Unifica Decisão e Laboratório e padroniza rolagem inteligente v0.36.0"
          git push
