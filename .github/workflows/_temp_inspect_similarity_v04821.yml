name: "TEMP finaliza Similaridade v0.48.21"

on:
  push:
    branches:
      - fix-similaridade-top5-v04821
    paths:
      - ".github/workflows/_temp_inspect_similarity_v04821.yml"

permissions:
  contents: write

jobs:
  fix-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-similaridade-top5-v04821
          fetch-depth: 0

      - name: Preparar Tk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk

      - name: Aplicar correcao
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def bounds(text, name):
              tree = ast.parse(text)
              nodes = [n for n in ast.walk(tree) if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name]
              if len(nodes) != 1:
                  raise SystemExit(f'{name}: {len(nodes)} ocorrencia(s)')
              return nodes[0].lineno - 1, nodes[0].end_lineno

          central_path = Path('source/gph_central.py')
          central = central_path.read_text(encoding='utf-8')
          if 'distinct_similarity_groups(similarity, requested_animals)' not in central:
              lines = central.splitlines(keepends=True)
              start, end = bounds(central, 'play_generate')
              sim_call = next((i for i in range(start, end) if 'similarity = self.db.method_similarity_day(' in lines[i]), None)
              groups_start = next((i for i in range(sim_call, end) if lines[i].strip() == 'groups = []'), None) if sim_call is not None else None
              selector_line = next((i for i in range(groups_start, end) if lines[i].strip() == 'selector = "Sombra Similaridade do Dia"'), None) if groups_start is not None else None
              if sim_call is None or groups_start is None or selector_line is None:
                  raise SystemExit('Bloco Similaridade em play_generate nao localizado')
              indent = lines[groups_start][:len(lines[groups_start]) - len(lines[groups_start].lstrip())]
              lines[groups_start:selector_line + 1] = [
                  indent + '# A previsao posicional pode repetir o mesmo bicho em mais de um premio.\n',
                  indent + '# Na geracao, completa com os proximos grupos mais fortes ate atingir\n',
                  indent + '# a quantidade de bichos distintos pedida pelo usuario.\n',
                  indent + 'from gph_similarity_rank import distinct_similarity_groups\n',
                  indent + 'groups = distinct_similarity_groups(similarity, requested_animals)\n',
                  indent + 'if len(groups) < requested_animals:\n',
                  indent + '    raise ValueError(\n',
                  indent + '        f"A Similaridade encontrou apenas {len(groups)} bicho(s) distinto(s) "\n',
                  indent + '        f"com evidencia para um pedido de {requested_animals}."\n',
                  indent + '    )\n',
                  indent + 'selector = "Sombra Similaridade do Dia"\n',
              ]
              central_path.write_text(''.join(lines), encoding='utf-8')

          history_path = Path('source/gph_history_lab.py')
          history = history_path.read_text(encoding='utf-8')
          if 'distinct_similarity_groups(selection, 5)' not in history:
              hlines = history.splitlines(keepends=True)
              start, end = bounds(history, 'run_history')
              branch = next((i for i in range(start, end) if hlines[i].strip() == 'elif selector == "Similaridade":'), None)
              selection_line = next((i for i in range(branch + 1, end) if 'selection = db.method_similarity_day(' in hlines[i]), None) if branch is not None else None
              groups_start = next((i for i in range(selection_line + 1, end) if hlines[i].strip() == 'groups = []'), None) if selection_line is not None else None
              if branch is None or selection_line is None or groups_start is None:
                  raise SystemExit('Bloco Similaridade em run_history nao localizado')
              branch_indent = hlines[branch][:len(hlines[branch]) - len(hlines[branch].lstrip())]
              next_branch = next((i for i in range(groups_start + 1, end) if hlines[i].startswith(branch_indent) and hlines[i].strip().startswith('else:')), None)
              if next_branch is None:
                  raise SystemExit('Fim do ramo Similaridade em run_history nao localizado')
              child_indent = hlines[selection_line][:len(hlines[selection_line]) - len(hlines[selection_line].lstrip())]
              hlines[groups_start:next_branch] = [
                  child_indent + 'from gph_similarity_rank import distinct_similarity_groups\n',
                  child_indent + 'groups = distinct_similarity_groups(selection, 5)\n',
              ]
              history_path.write_text(''.join(hlines), encoding='utf-8')

          version_path = Path('source/gph_version.py')
          version = version_path.read_text(encoding='utf-8')
          if 'APP_VERSION = "0.48.20"' in version:
              version_path.write_text(version.replace('APP_VERSION = "0.48.20"', 'APP_VERSION = "0.48.21"', 1), encoding='utf-8')
          elif 'APP_VERSION = "0.48.21"' not in version:
              raise SystemExit('Versao-base inesperada')
          PY

      - name: Testar
        shell: bash
        run: |
          cd source
          python -m py_compile gph_central.py gph_history_lab.py gph_similarity_rank.py gph_version.py
          python -m unittest discover -s tests -v
          python -m unittest tests.test_similarity_distinct_groups -v

      - name: Gravar correcao na branch
        shell: bash
        run: |
          rm -f _temp_similarity_extract_v04821.txt _temp_similarity_method_v04821.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/gph_history_lab.py source/gph_version.py
          git add -u -- _temp_similarity_extract_v04821.txt _temp_similarity_method_v04821.txt || true
          git commit -m "v0.48.21: corrige Top 5 distinto da Similaridade"
          git push origin HEAD:fix-similaridade-top5-v04821
