name: TEMP extrai Similaridade v0.48.21

on:
  push:
    branches:
      - fix-similaridade-top5-v04821
    paths:
      - ".github/workflows/_temp_inspect_similarity_v04821.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-similaridade-top5-v04821
      - name: Extrair somente funções-alvo
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          p=Path('source/gph_central.py')
          src=p.read_text(encoding='utf-8')
          tree=ast.parse(src)
          wanted={'method_similarity_day','play_generate'}
          out=[]
          for node in ast.walk(tree):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
                  seg=ast.get_source_segment(src,node) or ''
                  out.append(f'===== {node.name} L{node.lineno}-{node.end_lineno} =====\n{seg}')
          Path('_temp_similarity_method_v04821.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _temp_similarity_method_v04821.txt
          git commit -m "TEMP extrai funções da Similaridade v0.48.21"
          git push origin HEAD:fix-similaridade-top5-v04821
