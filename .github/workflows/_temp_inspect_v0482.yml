name: TEMP inspect v0.48.2

on:
  push:
    branches:
      - feat-round-advisor-all-methods-v0482

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inspecionar métodos
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\source"
          @'
          import ast, pathlib
          p = pathlib.Path('gph_central.py')
          text = p.read_text(encoding='utf-8')
          tree = ast.parse(text)
          db = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name=='Database')
          names = [n.name for n in db.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
          keys = ('reset','similar','meta','histor','seca','converg','pux')
          print('=== DATABASE METHODS ===')
          for name in names:
              low=name.lower()
              if any(k in low for k in keys): print(name)
          print('=== RELEVANT SOURCE ===')
          for n in db.body:
              if isinstance(n, ast.FunctionDef) and any(k in n.name.lower() for k in keys):
                  print('\n###', n.name)
                  print(ast.get_source_segment(text,n)[:12000])
          '@ | python -
