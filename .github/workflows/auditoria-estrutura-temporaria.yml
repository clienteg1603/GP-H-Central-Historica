name: Auditoria temporaria GP-H

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auditoria-estrutura-temporaria.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Auditoria complementar de UX e peso
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re, struct, collections

          src=Path('source/gph_central.py')
          text=src.read_text(encoding='utf-8')
          lines=text.splitlines()
          tree=ast.parse(text)

          print('=== OCORRENCIAS DOS CANDIDATOS ORFAOS ===')
          names=[
            'decision_snapshot_history','minmax_date','distinct_draws','search_filter_options',
            'search_filter_combination_exists','filter_options','list_draws','draw_filter_options',
            'set_payout_multiplier','payout_table','financial_by_kind','_theme_changed',
            'home_prepare_next_game','_set_card_bg','play_register','methods_sort_changed',
            'methods_hour_changed','show_generator_page','on_search_sort_changed','on_search_hour_changed',
            'open_statistics','open_pulls','open_methods_lab','open_game_generator','DryDayTechnicalDialog',
            'UI_FONT_MONO','UI_CARD_PADDING','UI_CARD_PADDING_COMPACT','PLAY_METHOD_LABELS'
          ]
          for name in names:
              print(name, len(re.findall(r'\b'+re.escape(name)+r'\b',text)))

          print('\n=== FUNCOES RELACIONADAS A RECOMENDACAO EM JOGAR ===')
          for node in ast.walk(tree):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and ('recommend' in node.name.lower() or 'shadow' in node.name.lower() and 'play' in node.name.lower()):
                  print(node.name,node.lineno,getattr(node,'end_lineno',node.lineno))
                  if 'recommend' in node.name.lower():
                      start=node.lineno; end=getattr(node,'end_lineno',node.lineno)
                      print('\n'.join(lines[start-1:min(end,start+120)]))

          print('\n=== REFERENCIAS A play_recommendation ===')
          for i,line in enumerate(lines,1):
              if 'play_recommendation' in line or '_play_refresh_shadow_recommendation' in line:
                  print(i,line.strip())

          print('\n=== ICONES ===')
          for p in sorted(Path('source/assets/icons').glob('*')):
              print(p.name,p.stat().st_size)

          print('\n=== MEMORIA ESTIMADA DOS PHOTOIMAGE DE BICHOS ===')
          # PhotoImage normalmente mantém pixels decodificados; estimativa conservadora RGBA 4 bytes/pixel.
          # O código guarda quatro tamanhos subsample(2,3,4,8) de cada PNG de cada pacote.
          def png_wh(p):
              b=p.read_bytes()[:24]
              if b[:8] != b'\x89PNG\r\n\x1a\n': return None
              return struct.unpack('>II',b[16:24])
          total_all=0; total_by_pack={}
          for pack in sorted(Path('source/assets/bichos_packs').iterdir()):
              if not pack.is_dir(): continue
              s=0
              for p in pack.glob('*.png'):
                  wh=png_wh(p)
                  if not wh: continue
                  w,h=wh
                  for n in (2,3,4,8):
                      sw=max(1,w//n); sh=max(1,h//n)
                      s += sw*sh*4
              total_by_pack[pack.name]=s; total_all += s
          for k,v in total_by_pack.items(): print(k,v,round(v/1024/1024,2),'MiB')
          print('all_packs_estimated=',total_all,round(total_all/1024/1024,2),'MiB')
          print('active_pack_only_max=',max(total_by_pack.values()),round(max(total_by_pack.values())/1024/1024,2),'MiB')

          print('\n=== TAMANHO DE ASSETS EMPACOTADOS ===')
          assets=Path('source/assets')
          asset_bytes=sum(p.stat().st_size for p in assets.rglob('*') if p.is_file())
          legacy=sum(p.stat().st_size for p in (assets/'bichos').glob('*') if p.is_file())
          packs=sum(p.stat().st_size for p in (assets/'bichos_packs').rglob('*') if p.is_file())
          print('assets_total',asset_bytes,round(asset_bytes/1024/1024,2),'MiB')
          print('legacy_bichos',legacy,round(legacy/1024/1024,2),'MiB')
          print('packs',packs,round(packs/1024/1024,2),'MiB')

          print('\n=== FONTES LITERAIS FORA DO SISTEMA DE ESTILOS ===')
          for font in ['Segoe UI Semibold','Segoe UI','Consolas']:
              print(font,text.count(font))

          print('\n=== MESSAGEBOX ===')
          print('showinfo',text.count('messagebox.showinfo'))
          print('showwarning',text.count('messagebox.showwarning'))
          print('showerror',text.count('messagebox.showerror'))
          print('askyesno',text.count('messagebox.askyesno'))

          print('\n=== DOCUMENTOS/FERRAMENTAS DE SOURCE ===')
          for p in sorted(Path('source').iterdir()):
              if p.is_file(): print(p.name,p.stat().st_size)

          print('\n=== FIM ===')
          PY
