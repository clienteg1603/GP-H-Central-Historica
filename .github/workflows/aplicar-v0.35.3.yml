name: Aplicar evolução v0.35.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aplicar-v0.35.3.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar v0.35.3
        shell: bash
        run: |
          python .github/scripts/aplicar_v0353.py
          python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py

      - name: Publicar alteração e remover temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aplicar-v0.35.3.yml .github/scripts/aplicar_v0353.py
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt source/ATUALIZACOES_PROGRAMA_v0.35.txt
          git commit -m "Evolui Recomendação da Rodada para v0.35.3"
          git push
