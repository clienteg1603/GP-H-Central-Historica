name: Aplicar evolução v0.35.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aplicar-v0.35.3.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar v0.35.3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('source/gph_central.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('GP-H Central Histórica v0.35.2', 'GP-H Central Histórica v0.35.3', 1)
          text = text.replace('APP_VERSION = "0.35.2"', 'APP_VERSION = "0.35.3"', 1)

          marker = '    def _play_refresh_shadow_recommendation(self):\n'
          if '_shadow_recommendation_current_context' not in text:
              if marker not in text:
                  raise SystemExit('Ponto de inserção da recomendação não encontrado')
              helper = '''    def _shadow_recommendation_current_context(self, target, scope, best_name):
        """Explica a recomendação com sinais atuais sem mudar o vencedor histórico."""
        try:
            status = self.db.shadow_lab_status(target)
            current = (status or {}).get("current") or {}
            payload = current.get("payload") or {}
            bpayload = payload.get("bichos") or {}

            method_groups = {}
            support = Counter()
            for method in ("Reset Cobertura", "Puxada Combinada", "Similaridade"):
                rec = bpayload.get(method) or {}
                groups = []
                for value in rec.get("groups") or []:
                    try:
                        group = int(value)
                    except Exception:
                        continue
                    if 1 <= group <= 25 and group not in groups:
                        groups.append(group)
                groups = groups[:5]
                if groups:
                    method_groups[method] = groups
                    support.update(groups)

            parts = []
            available_count = len(method_groups)
            convergent = sorted(
                ((group, count) for group, count in support.items() if count >= 2),
                key=lambda item: (-item[1], item[0]),
            )
            if available_count >= 2:
                if convergent:
                    labels = [
                        f"{BICHOS.get(group, str(group)).title()} {count}/{available_count}"
                        for group, count in convergent[:5]
                    ]
                    parts.append("Convergência atual: " + ", ".join(labels))
                else:
                    parts.append(f"Convergência atual: nenhuma coincidência entre {available_count} métodos")

            method_map = {
                "Reset + Histórica": "Reset Cobertura",
                "Puxada + Histórica": "Puxada Combinada",
                "Similaridade + Histórica": "Similaridade",
            }
            chosen_method = method_map.get(best_name, best_name if best_name in method_groups else None)
            if chosen_method in method_groups and available_count >= 2:
                groups = method_groups[chosen_method]
                shared = [group for group in groups if support.get(group, 0) >= 2]
                parts.append(f"Apoio ao recomendado: {len(shared)}/{len(groups)} bichos reforçados por outro método")

            if str(scope or "") == "1º":
                dry = ((payload.get("seca_1p") or {}).get("Seca do Dia 1º") or {})
                dry_groups = []
                for value in dry.get("groups") or []:
                    try:
                        group = int(value)
                    except Exception:
                        continue
                    if 1 <= group <= 25 and group not in dry_groups:
                        dry_groups.append(group)
                dry_groups = dry_groups[:5]
                if dry_groups:
                    dry_names = ", ".join(BICHOS.get(group, str(group)).title() for group in dry_groups)
                    overlap = [group for group in dry_groups if support.get(group, 0) >= 2]
                    suffix = f" • {len(overlap)} também na convergência" if convergent else ""
                    parts.append(f"Seca 1º atual: {dry_names}{suffix}")

            return " • ".join(parts)
        except Exception:
            return ""

'''
              text = text.replace(marker, helper + marker, 1)

          old = '''            if note is not None:
                note.configure(
                    text=f"{best['rounds']} rodadas prospectivas neste horário • {best['detail']}. Evidência histórica, não garantia de acerto."
                )'''
          new = '''            if note is not None:
                base_note = f"{best['rounds']} rodadas prospectivas neste horário • {best['detail']}."
                current_context = self._shadow_recommendation_current_context(target, scope, best.get("name"))
                if current_context:
                    base_note += f" • {current_context}."
                base_note += " Evidência histórica, não garantia de acerto."
                note.configure(text=base_note)'''
          if old not in text:
              raise SystemExit('Bloco final da recomendação não encontrado')
          text = text.replace(old, new, 1)

          recent = '            "• v0.35.0 — Laboratório Sombra visível, coleta prospectiva automática após novos resultados e painel separado para Puxadas/Seca 1º.\\n"\n'
          if recent in text and '• v0.35.3 — Recomendação da Rodada' not in text:
              text = text.replace(recent,
                  '            "• v0.35.3 — Recomendação da Rodada explica desempenho do horário, convergência atual e Seca do 1º.\\n"\n' + recent,
                  1)

          p.write_text(text, encoding='utf-8')

          doc = Path('source/DOCUMENTACAO_GP-H.txt')
          d = doc.read_text(encoding='utf-8')
          d = d.replace('VERSÃO ATUAL: v0.35.2', 'VERSÃO ATUAL: v0.35.3', 1)
          block = '''REVISÃO v0.35.3 — RECOMENDAÇÃO EXPLICADA / CONTEXTO ATUAL
- A Recomendação da Rodada continua escolhendo a melhor evidência prospectiva do mesmo horário.
- A explicação passa a cruzar essa evidência com a convergência atual entre Reset Cobertura, Puxada Combinada e Similaridade.
- Para o método recomendado, informa quantos dos seus bichos também estão sendo reforçados por outro método.
- Quando o escopo é 1º prêmio, a Seca do Dia aparece separadamente no contexto atual e indica sobreposição com a convergência quando existir.
- A convergência atual serve como apoio/discordância e NÃO substitui sozinha o vencedor histórico, evitando promover um método por coincidência de uma única rodada.
- Empates e ausência de convergência são mostrados sem desempates artificiais.
- Nenhum método, fórmula, histórico ou jogo oficial foi alterado.

'''
          if not d.startswith('REVISÃO v0.35.3'):
              d = block + d
          doc.write_text(d, encoding='utf-8')

          upd = Path('source/ATUALIZACOES_PROGRAMA_v0.35.txt')
          u = upd.read_text(encoding='utf-8')
          u = u.replace('GP-H CENTRAL HISTÓRICA v0.35.2', 'GP-H CENTRAL HISTÓRICA v0.35.3', 1)
          ublock = '''Novidades v0.35.3:
- Recomendação da Rodada passa a explicar o desempenho prospectivo daquele horário.
- Mostra a convergência atual entre Reset Cobertura, Puxada Combinada e Similaridade.
- Informa quantos bichos do método recomendado recebem apoio de outro método.
- No escopo 1º prêmio, mostra também a Seca do Dia atual e sua sobreposição com a convergência.
- A convergência não promove métodos sozinha; nenhum método ou fórmula oficial foi alterado.

'''
          anchor = 'Novidades v0.35.2:\n'
          if 'Novidades v0.35.3:' not in u:
              if anchor not in u:
                  raise SystemExit('Âncora de atualizações não encontrada')
              u = u.replace(anchor, ublock + anchor, 1)
          upd.write_text(u, encoding='utf-8')
          PY

          python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py

      - name: Publicar alteração e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aplicar-v0.35.3.yml
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt source/ATUALIZACOES_PROGRAMA_v0.35.txt
          git commit -m "Evolui Recomendação da Rodada para v0.35.3"
          git push
