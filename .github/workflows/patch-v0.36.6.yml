name: Aplicar Gerador -> Jogar v0.36.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v0.36.6.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar patch
        run: python .github/scripts/patch_v0366.py

      - name: Validar Python e rotas
        run: |
          python -m py_compile source/gph_central.py
          python - <<'PY'
          from pathlib import Path
          import ast, re
          text = Path('source/gph_central.py').read_text(encoding='utf-8')
          assert 'APP_VERSION = "0.36.6"' in text
          assert '("Gerador", self.show_generator_page, "generator"),' not in text
          assert 'lambda _e: self.show_play_page(),' in text
          assert 'def show_generator_page(self):\n        """Compatibilidade: a antiga tela Gerador foi absorvida por Jogar."""\n        return self.show_play_page()' in text
          assert 'def open_game_generator(self):\n        # Compatibilidade com chamadas antigas: geração oficial vive em Jogar.\n        self.show_play_page()' in text
          m = re.search(r'def home_prepare_next_game\(self\):(.*?)(?=\n    def )', text, re.S)
          assert m, 'home_prepare_next_game nao encontrado'
          block = m.group(1)
          assert 'self.show_play_page()' in block
          assert 'self.play_generate()' in block
          assert 'self.show_generator_page()' not in block
          assert 'self.generator_generate()' not in block
          ast.parse(text)
          print('Rotas/UI v0.36.6 OK')
          PY

      - name: Confirmar motor oficial preservado
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('source/gph_central.py').read_text(encoding='utf-8')
          assert 'main_dez = segunda["numero"]' in text
          assert 'extra_dez = terceira["numero"]' in text
          assert 'main_dez = principal["numero"]' in text
          assert 'extra_dez = segunda["numero"]' in text
          assert 'freeze_rule": "persistente_ate_reaparicao_do_bicho"' in text
          assert 'def generator_generate(self):' in text
          assert 'def generator_render_31_state(self, generation):' in text
          print('Motor e Reset + 3+1 preservados')
          PY

      - name: Publicar source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt source/ATUALIZACOES_PROGRAMA_v0.35.txt
          git commit -m "GP-H v0.36.6: Gerador absorvido por Jogar"
          git push
