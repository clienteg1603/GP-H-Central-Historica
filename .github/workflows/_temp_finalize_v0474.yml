name: TEMP finalizar v0.47.4 Meta v0.2 + Lei GP-H
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
          fetch-depth: 0
      - name: Preparar ambiente e baseline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          cp source/gph_central.py /tmp/gph_before_meta_v0474.py
      - name: Admitir Tabela 1 no Meta v0.2
        run: python _temp_patch_meta_table1_v0474.py
      - name: Validar integração final
        run: |
          python -m py_compile source/gph_central.py
          python _temp_validate_meta_table1_v0474.py
          git diff --check
      - name: Limpar todos os temporários e salvar versão final da branch
        run: |
          rm -rf source/__pycache__ __pycache__
          git rm -f .github/workflows/_temp_finalize_v0474.yml
          git rm -f .github/workflows/_temp_inspect_v0474_feature.yml
          git rm -f .github/workflows/temp-inspect-v0474.yml
          git rm -f _temp_history_groups_v0474.b64
          git rm -f _temp_meta_table1_admission.py
          git rm -f _temp_patch_meta_table1_v0474.py
          git rm -f _temp_validate_meta_table1_v0474.py
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          if find . -path './.git' -prune -o -type f \( -name '_temp*' -o -name 'temp-*' \) -print | grep -q .; then
            echo 'ERRO: ainda há temporários:'
            find . -path './.git' -prune -o -type f \( -name '_temp*' -o -name 'temp-*' \) -print
            exit 1
          fi
          git diff --cached --check
          echo '=== DIFF FINAL ==='
          git diff --cached --stat
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v0.47.4 Meta v0.2 com Tabela 1 e Lei GP-H universal'
          git push origin HEAD:feature-lei-geracao-meta-tabela1-v0474
