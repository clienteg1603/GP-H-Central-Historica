name: TEMP mapear geração universal v0.47.4
on:
  push:
    paths: ['.github/workflows/inspect-generation-law-v0474.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair trechos relevantes
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8')
          t=ast.parse(s)
          exact={'distribute_game_counts','generate_centenas_3plus1','generate_group_combinations','generate_historical_concentrated_bundle','number_rankings_for_group'}
          for node in ast.walk(t):
              if not isinstance(node,ast.FunctionDef): continue
              name=node.name
              low=name.lower()
              if name in exact or ('play' in low and any(k in low for k in ('generate','method','selector','preview','refresh','context'))) or ('milhar' in low and 'generate' in low) or ('centena' in low and 'generate' in low):
                  seg=ast.get_source_segment(s,node) or ''
                  print(f'\n===== {name} L{node.lineno}-{getattr(node,"end_lineno",0)} len={len(seg)} =====')
                  print(seg[:50000])
          PY
