name: Auditoria Historico Concentrado

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-historico-concentrado.yml"
      - ".github/scripts/audit_historico_concentrado.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/audit_historico_concentrado.py
