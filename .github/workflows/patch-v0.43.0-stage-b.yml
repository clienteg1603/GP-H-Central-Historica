name: GP-H Etapa B calibração v0.43.0

on:
  push:
    paths:
      - '.github/workflows/patch-v0.43.0-stage-b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar Etapa B
        run: python .github/scripts/patch_v0430_stage_b.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py

      - name: Testar calibração sintética
        run: python .github/scripts/test_v0430_stage_b.py

      - name: Validar invariantes
        shell: pwsh
        run: |
          $t = Get-Content source/gph_central.py -Raw -Encoding UTF8
          if ($t -notmatch 'APP_VERSION = "0.43.0"') { throw 'Versão incorreta' }
          if ($t -notmatch 'def decision_confidence_calibration') { throw 'Motor de calibração ausente' }
          if ($t -notmatch 'CALIBRAÇÃO DA CONFIANÇA — ETAPA B') { throw 'Painel Etapa B ausente' }
          if ($t -notmatch 'self\._decision_build_confidence_calibration\(body\)') { throw 'Painel não integrado à Decisão' }
          if ($t -notmatch 'changes_decision":False') { throw 'Proteção observacional ausente' }
          $d = Get-Content source/DOCUMENTACAO_GP-H.txt -Raw -Encoding UTF8
          if (-not $d.StartsWith('REVISÃO v0.43.0')) { throw 'Documentação não atualizada' }
          Write-Host 'VALIDAÇÃO v0.43.0 ETAPA B OK'

      - name: Registrar v0.43.0
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --stat
          git commit -m "v0.43.0 Etapa B calibracao da confianca da Decisao"
          git push origin main
