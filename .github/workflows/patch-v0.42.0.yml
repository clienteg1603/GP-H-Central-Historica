name: GP-H Meta Walk-Forward v0.42.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v0.42.0.yml"
      - ".github/scripts/patch_v0420.py"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar v0.42.0
        run: python .github/scripts/patch_v0420.py
      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py
      - name: Preparar Tk para testes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
      - name: Testar Walk-Forward rigoroso do Meta
        run: |
          python - <<'PY'
          import importlib.util, sys, tempfile
          from pathlib import Path
          from datetime import date, timedelta

          spec=importlib.util.spec_from_file_location('gph_meta_wf_test',Path('source/gph_central.py'))
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          db=mod.Database(Path(tempfile.mkdtemp())/'wf.db')

          start=date(2026,1,1)
          draws=[]
          for i in range(90):
              d=(start+timedelta(days=i)).isoformat()
              draws.append({
                  'data':d,'sorteio':'PT','hora':'14h',
                  'prizes':[{'grupo':1},{'grupo':2},{'grupo':3},{'grupo':20},{'grupo':21}],
              })
          db._draws_in_order=lambda: draws
          db._is_operational_draw=lambda d: True
          db._reset_expected_target=lambda b: {
              'data':(date.fromisoformat(b['data'])+timedelta(days=1)).isoformat(),
              'sorteio':'PT','hora':'14h'
          }

          def reset(*args,**kwargs):
              return {'selected':[
                  {'grupo':g,'score_pct':100-8*i} for i,g in enumerate([1,2,3,4,5])
              ],'training_transitions':200,'pair3_matches':12,'context_mode':'general','lookahead_safe':True}
          def pull(*args,**kwargs):
              return {'selected':[
                  {'grupo':g,'source_count':5-i,'sum_prob':100-10*i} for i,g in enumerate([1,2,3,4,5])
              ],'lookahead_safe':True}
          def sim(*args,**kwargs):
              return {'selected':[
                  {'grupo':g,'weighted_share':80-10*i} for i,g in enumerate([1,2,3,6,7])
              ],'candidate_count':12,'top_days':[],'lookahead_safe':True}
          def hist(*args,**kwargs):
              return {'selected':[
                  {'grupo':g,'indication_count':5-i,'sum_prob':110-10*i} for i,g in enumerate([1,2,3,8,9])
              ],'lookahead_safe':True}
          db.method_reset_coverage_v1=reset
          db.method_convergencia_g5=pull
          db.method_similarity_day=sim
          db.method_historico_concentrado_v01=hist

          # O ajuste real já foi testado na v0.41 e está travado por AST. Aqui
          # aceleramos o teste para validar a mecânica temporal da v0.42.
          db._meta_fit_logit=lambda examples,epochs=240,l2=0.025: {
              'intercept':0.0,'coefficients':[1.0]*20,'examples':len(examples)
          }
          db._meta_model_score=lambda model,features: sum(features)

          original_examples=db._meta_examples
          seen=[]
          def guarded(records,focus_target=None):
              focus=focus_target['data']
              assert records, 'treino vazio'
              assert all(r['target_data'] < focus for r in records), (records[-1]['target_data'],focus)
              seen.append((len(records),focus))
              return original_examples(records,focus_target=focus_target)
          db._meta_examples=guarded

          result=db.meta_walk_forward(window=20)
          assert result['simulated_rounds']==20, result['simulated_rounds']
          assert result['brain_frozen'] is True and result['model_version']=='META_LOGIT_NATIVE_V1'
          assert result['lookahead_safe'] is True
          assert len(result['summary'])==5
          assert len(result['meta_head_to_head'])==4
          assert abs(result['random_baseline']['avg_coverage']-1.0)<1e-9
          assert all(n>=20 for n,_focus in seen)
          meta=next(r for r in result['summary'] if r['method']=='GP-H Meta v0.1')
          assert meta['avg_coverage'] >= 3.0, meta
          first=result['details'][0]['methods']['GP-H Meta v0.1']
          assert first['training_rounds']>=20
          assert len(first['groups'])==5 and len(set(first['groups']))==5
          print('TESTES WALK-FORWARD META v0.42.0 OK')
          PY
      - name: Validar invariantes e documentação
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          t=Path('source/gph_central.py').read_text(encoding='utf-8')
          ast.parse(t)
          assert 'APP_VERSION = "0.42.0"' in t
          assert 'def meta_walk_forward(' in t
          assert 'def _meta_walk_forward_start(' in t
          assert 'values=["20","30","60"]' in t
          assert 'META_LOGIT_NATIVE_V1' in t
          d=Path('source/DOCUMENTACAO_GP-H.txt').read_text(encoding='utf-8')
          assert d.startswith('REVISÃO v0.42.0')
          assert '2–3 dias' in d and '20–30 rodadas prospectivas' in d
          print('VALIDAÇÃO ESTRUTURAL v0.42.0 OK')
          PY
      - name: Registrar v0.42.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --stat
          git commit -m "v0.42.0 Walk-Forward rigoroso do GP-H Meta"
          git push origin main
