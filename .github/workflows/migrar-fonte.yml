name: Migrar fonte v0.35.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrar-fonte.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Migrar v0.35.0 para source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GP-H_Central_Historica_v0.35.0_Teste_GitHub.zip"
          test -f "$ZIP" || { echo "Arquivo $ZIP não encontrado"; exit 1; }
          TMP="$RUNNER_TEMP/gph_migracao"
          rm -rf "$TMP" source
          mkdir -p "$TMP" source
          unzip -q "$ZIP" -d "$TMP"
          SRC="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SRC" || { echo "Pasta principal não encontrada no ZIP"; exit 1; }
          rsync -a \
            --exclude '.github/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude 'build/' \
            --exclude 'dist/' \
            --exclude 'release_server/' \
            --exclude 'windows_package/' \
            --exclude 'PUBLICAR_GITHUB.txt' \
            "$SRC/" source/
          test -f source/gph_central.py
          test -f source/gph_updater.py
          test -f source/GP-H_Central.spec
          test -f source/GP-H_Updater.spec
          test -d source/assets

      - name: Publicar código-fonte no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source
          if git diff --cached --quiet; then
            echo "A pasta source já está atualizada."
          else
            git commit -m "Migra v0.35.0 para código-fonte do repositório"
            git push
          fi

      - name: Compilar fonte migrada no canal Teste
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publicar-atualizacao.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f channel=test \
            -f notes="v0.35.0 Teste — compilação direta do código-fonte do GitHub"
