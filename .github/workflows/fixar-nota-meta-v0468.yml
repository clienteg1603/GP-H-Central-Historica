name: Ajustar nota do Fechamento Meta v0.46.8

on:
  push:
    branches:
      - meta-jogavel-v0468

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meta-jogavel-v0468
          fetch-depth: 0
      - name: Ajustar nota sem tocar na lógica
        shell: python
        run: |
          from pathlib import Path
          p=Path('source/gph_central.py')
          s=p.read_text(encoding='utf-8')
          old='''        note.configure(text=(\n            f"{len(ranking)} bichos-base • {requested_text} • repetição na extração-base conta novamente, como no Histórico v0.1"\n        ))'''
          new='''        if generation.get("meta_bundle"):\n            note.configure(text=(\n                f"{len(ranking)} bichos-base • {requested_text} • ranking GP-H Meta congelado antes do resultado"\n            ))\n        else:\n            note.configure(text=(\n                f"{len(ranking)} bichos-base • {requested_text} • repetição na extração-base conta novamente, como no Histórico v0.1"\n            ))'''
          if s.count(old)!=1:
              raise SystemExit(f'Trecho esperado não encontrado de forma única: {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validar
        run: |
          python -m py_compile source/gph_central.py
          git diff --check
          grep -q "ranking GP-H Meta congelado antes do resultado" source/gph_central.py
      - name: Limpar workflow e salvar
        run: |
          rm -f .github/workflows/fixar-nota-meta-v0468.yml
          find source -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find source -type f -name '*.pyc' -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.46.8 corrige nota visual do Fechamento Meta"
          git push origin HEAD:meta-jogavel-v0468
