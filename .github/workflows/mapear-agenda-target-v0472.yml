name: Mapear pontos da agenda v0.47.2
on:
  push:
    branches: [fix-agenda-semanal-v0472]
permissions:
  contents: write
jobs:
  mapear:
    if: ${{ !contains(github.event.head_commit.message, '[agenda-target]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-agenda-semanal-v0472
      - name: Extrair contextos exatos
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8')
          lines=s.splitlines()
          needles=('def next_operational_target','def is_next_operational_target','next_operational_target(', 'play_round', 'round_options', 'rodada_options', 'PTN 18:00', 'PTN', 'FEDERAL', 'Federal')
          centers=[]
          for i,line in enumerate(lines):
              if any(n in line for n in needles): centers.append(i)
          # agrupa faixas amplas sem duplicar
          ranges=[]
          for i in centers:
              a=max(0,i-90); b=min(len(lines),i+180)
              if ranges and a <= ranges[-1][1]+20:
                  ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
              else: ranges.append((a,b))
          out=[]
          for a,b in ranges:
              out.append(f'\n===== SOURCE L{a+1}-L{b} =====\n')
              for j in range(a,b): out.append(f'{j+1}: {lines[j]}\n')
          # document contexts
          d=Path('source/DOCUMENTACAO_GP-H.txt').read_text(encoding='utf-8').splitlines()
          out.append('\n===== DOC CONTEXTS =====\n')
          for i,line in enumerate(d):
              if any(n.lower() in line.lower() for n in ('federal','quarta','domingo','ptn 18','18h')):
                  a=max(0,i-4); b=min(len(d),i+5)
                  out.append(f'--- DOC L{a+1}-L{b} ---\n')
                  for j in range(a,b): out.append(f'{j+1}: {d[j]}\n')
          Path('_agenda_targeted.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Salvar temporário
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _agenda_targeted.txt
          git commit -m '[agenda-target] pontos exatos da agenda'
          git push origin HEAD:fix-agenda-semanal-v0472
