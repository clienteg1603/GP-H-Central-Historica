name: Inspecionar ternos v0.47.3
on:
  push:
    branches: [fix-ternos-diversificacao-v0473]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ternos-diversificacao-v0473
          fetch-depth: 0
      - name: Mapear geradores
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('source/gph_central.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=['combinations(', 'Terno de Grupo', 'GROUP_COMBO_SIZES', 'GERAR COM META', 'meta', 'generate', 'palpites']
          hits=[]
          for i,line in enumerate(lines,1):
              low=line.lower()
              if ('combinations(' in line or 'Terno de Grupo' in line or 'GROUP_COMBO_SIZES' in line or
                  'GERAR COM META' in line or 'meta' in low and ('def ' in line or 'button' in low or 'gerar' in low)):
                  hits.append(i)
          ranges=[]
          for n in hits:
              a=max(1,n-25); b=min(len(lines),n+50)
              if not ranges or a>ranges[-1][1]+5:
                  ranges.append([a,b])
              else:
                  ranges[-1][1]=max(ranges[-1][1],b)
          out=[]
          for a,b in ranges:
              out.append(f'===== L{a}-L{b} =====')
              out.extend(f'{i}: {lines[i-1]}' for i in range(a,b+1))
          Path('_ternos_map.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Salvar mapa
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _ternos_map.txt
          git commit -m 'Mapeia geradores de ternos v0.47.3' || true
          git push origin HEAD:fix-ternos-diversificacao-v0473
