name: Validar v0.48.2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validar Python, causalidade e cérebro congelado
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\source"
          python -m py_compile gph_central.py gph_bootstrap.py gph_version.py gph_round_advisor.py gph_updater.py gph_history_lab.py gph_history_ui.py CRIAR_PACOTE_ATUALIZACAO.py
          @'
          import ast, pathlib
          advisor = pathlib.Path('gph_round_advisor.py').read_text(encoding='utf-8')
          tree = ast.parse(advisor)
          choose = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'choose_recommendation')
          numeric = [n.value for n in ast.walk(choose) if isinstance(n, ast.Constant) and isinstance(n.value, (int, float))]
          assert .5 not in numeric and 50 not in numeric, '50% virou valor numérico da escolha'
          forbidden = ('meta_shadow_prediction(', 'meta_walk_forward(', '_meta_fit_logit(', 'meta_play_formation_prediction(')
          assert not any(x in advisor for x in forbidden), 'advisor está reconstruindo/retreinando Meta'
          frozen = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == '_load_frozen_meta_groups')
          frozen_text = ast.get_source_segment(advisor, frozen)
          assert 'meta_frozen_at' in frozen_text, 'Meta histórico não exige congelamento prospectivo'
          lab_text = pathlib.Path('gph_history_lab.py').read_text(encoding='utf-8')
          assert 'FROZEN_SELECTOR' in lab_text and '"Similaridade": "method_similarity_day"' in lab_text
          version = pathlib.Path('gph_version.py').read_text(encoding='utf-8')
          assert 'APP_VERSION = "0.48.2"' in version
          '@ | python -
          git diff --exit-code origin/main -- gph_central.py
          if ($LASTEXITCODE -ne 0) { throw "gph_central.py/Meta congelado foi alterado" }

      - name: Rodar testes
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\source"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam" }

      - name: Validar build Windows sem console
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          Set-Location "$env:GITHUB_WORKSPACE\source"
          python -m PyInstaller --clean --noconfirm "GP-H_Updater.spec"
          python -m PyInstaller --clean --noconfirm "GP-H_Central.spec"
          if (-not (Test-Path "dist\GP-H_Updater.exe")) { throw "Updater não gerado" }
          if (-not (Test-Path "dist\GP-H Central Historica.exe")) { throw "Central não gerada" }
