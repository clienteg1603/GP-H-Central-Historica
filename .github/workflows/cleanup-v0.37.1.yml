name: Limpeza estrutural v0.37.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-v0.37.1.yml"
      - ".github/scripts/cleanup_v0371.py"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar limpeza estrutural segura
        run: python .github/scripts/cleanup_v0371.py

      - name: Validar Python e invariantes
        run: |
          python -m py_compile source/gph_central.py
          python - <<'PY'
          from pathlib import Path
          import ast, re
          p=Path('source/gph_central.py')
          text=p.read_text(encoding='utf-8')
          tree=ast.parse(text)
          assert 'APP_VERSION = "0.37.1"' in text
          assert 'def generate_centenas_3plus1(' in text
          assert 'def centena_31_freeze_state(' in text
          assert 'def decision_contextual_evidence(' in text
          assert 'def show_play_page(' in text
          assert 'def show_decision_page(' in text
          assert 'self._set_active_nav("Gerador")' not in text
          assert 'self._page = "generator"' not in text
          for cls in ('GameGeneratorDialog','MethodsLabDialog','HistoricalPullsDialog','StatisticsDialog'):
              assert not re.search(rf'^class {cls}\b', text, re.M), cls
          app=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='App')
          f=next(n for n in app.body if isinstance(n,ast.FunctionDef) and n.name=='show_generator_page')
          assert isinstance(f.body[-1], ast.Return)
          print('VALIDAÇÃO ESTRUTURAL OK')
          print('LINHAS', len(text.splitlines()))
          PY

      - name: Registrar v0.37.1 no source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --stat
          git commit -m "v0.37.1 limpeza estrutural sem alteração funcional"
          git push origin main
