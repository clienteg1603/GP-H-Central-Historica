name: Aplicar diversificação de ternos v0.47.3
on:
  push:
    branches: [fix-ternos-diversificacao-v0473]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ternos-diversificacao-v0473
          fetch-depth: 0
      - name: Guardar baseline
        run: cp source/gph_central.py /tmp/gph_before_ternos_v0473.py
      - name: Aplicar correção
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('source/gph_central.py')
          text=p.read_text(encoding='utf-8')
          old='''        combos = list(combinations(unique, size))\n        rows = []\n\n        for combo in combos[:max(1, int(total))]:\n'''
          new='''        # Ordena pelas posições do ranking: primeiro esgota o menor núcleo\n        # de líderes capaz de produzir jogos distintos e só depois abre para\n        # o próximo bicho. Para 5 bichos e 5 ternos: ABC, ABD, ACD, BCD, ABE.\n        # Assim o líder continua priorizado, mas não aparece em todos os jogos.\n        ranked_combos = []\n        for idx_combo in combinations(range(len(unique)), size):\n            combo = tuple(unique[i] for i in idx_combo)\n            ranked_combos.append((\n                max(idx_combo),\n                sum(idx_combo),\n                idx_combo,\n                combo,\n            ))\n        ranked_combos.sort(key=lambda item: (item[0], item[1], item[2]))\n        combos = [item[3] for item in ranked_combos]\n        rows = []\n\n        for combo in combos[:max(1, int(total))]:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Bloco generate_group_combinations inesperado: {text.count(old)} ocorrência(s)')
          text=text.replace(old,new,1)
          text,n=re.subn(r'APP_VERSION\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"','APP_VERSION = "0.47.3"',text,count=1)
          if n != 1:
              raise SystemExit('APP_VERSION não encontrado')
          p.write_text(text,encoding='utf-8')

          d=Path('source/DOCUMENTACAO_GP-H.txt')
          docs=d.read_text(encoding='utf-8')
          note='''REVISÃO v0.47.3 — TERNOS / DIVERSIFICAÇÃO DO LÍDER\n\n- Corrige a montagem genérica de combinações de Grupo: as primeiras combinações lexicográficas podiam colocar o líder em todos os 5 Ternos.\n- Com 5 bichos ranqueados e 5 Ternos, a ordem passa a ser ABC, ABD, ACD, BCD, ABE: preserva concentração nos líderes, mas inclui um Terno sem o líder.\n- A correção vale para Oficial • Reset combinações, GP-H Meta v0.1, Puxada Combinada, Similaridade combinações e Manual, pois todos usam o mesmo gerador de combinações de Grupo.\n- Duplas e Quadras de Grupo também passam a respeitar a mesma ordenação por núcleo ranqueado; Quina continua naturalmente única quando há exatamente 5 bichos.\n- O GP-H Histórico Concentrado já utilizava essa ordem e não precisou ser alterado.\n- Nenhum ranking, cérebro, peso, probabilidade, Meta, Reset, Puxada, Similaridade, Histórico, 3+1 ou Decisão foi recalibrado; mudou apenas a montagem dos jogos a partir de um ranking já pronto.\n\n'''
          if not docs.startswith('REVISÃO v0.47.3'):
              d.write_text(note+docs,encoding='utf-8')
          PY
      - name: Validar sintaxe e comportamento
        run: |
          python -m py_compile source/gph_central.py
          python - <<'PY'
          import ast
          from itertools import combinations
          from pathlib import Path

          before=ast.parse(Path('/tmp/gph_before_ternos_v0473.py').read_text(encoding='utf-8'))
          after=ast.parse(Path('source/gph_central.py').read_text(encoding='utf-8'))

          def db_methods(tree):
              cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='Database')
              return {n.name:n for n in cls.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          bm,am=db_methods(before),db_methods(after)
          assert bm.keys()==am.keys(), 'Conjunto de métodos Database mudou'
          changed=[name for name in bm if ast.dump(bm[name],include_attributes=False)!=ast.dump(am[name],include_attributes=False)]
          assert changed==['generate_group_combinations'], f'Métodos Database alterados inesperadamente: {changed}'

          cls=next(n for n in after.body if isinstance(n,ast.ClassDef) and n.name=='Database')
          fn=next(n for n in cls.body if isinstance(n,ast.FunctionDef) and n.name=='generate_group_combinations')
          fn=ast.fix_missing_locations(fn)
          ns={
              'combinations': combinations,
              'GROUP_COMBO_SIZES': {'Dupla de Grupo':2,'Terno de Grupo':3,'Quadra de Grupo':4,'Quina de Grupo':5},
              'BICHOS': {15:'JACARÉ',21:'TOURO',2:'ÁGUIA',9:'COBRA',4:'BORBOLETA'},
          }
          exec(compile(ast.Module(body=[fn],type_ignores=[]),'<gerador>','exec'),ns)
          gen=ns['generate_group_combinations']
          groups=[15,21,2,9,4]
          out=gen(None,groups,'Terno de Grupo',5)
          nums=[r['numero'] for r in out['rows']]
          expected=['15-21-02','15-21-09','15-02-09','21-02-09','15-21-04']
          assert nums==expected, (nums,expected)
          assert sum('15' in n.split('-') for n in nums)==4, nums
          assert len(set(nums))==5

          d=gen(None,groups,'Dupla de Grupo',5)
          dnums=[r['numero'] for r in d['rows']]
          assert len(dnums)==5 and len(set(dnums))==5
          assert sum('15' in n.split('-') for n in dnums)<5

          q=gen(None,groups,'Quadra de Grupo',5)
          qnums=[r['numero'] for r in q['rows']]
          assert len(qnums)==5 and len(set(qnums))==5
          assert sum('15' in n.split('-') for n in qnums)==4

          print('OK: somente generate_group_combinations mudou no Database')
          print('OK: Ternos =', nums)
          print('OK: líder aparece em 4/5, não 5/5')
          print('OK: Dupla/Quadra também evitam concentração total quando há alternativa')
          PY
          git diff --check
      - name: Limpar temporários e salvar versão validada
        run: |
          rm -rf source/__pycache__ __pycache__
          git rm -f --ignore-unmatch .github/workflows/inspect-ternos-v0473.yml .github/workflows/apply-ternos-v0473.yml _ternos_map.txt
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[ternos-final] v0.47.3 Diversifica líder nas combinações'
          git push origin HEAD:fix-ternos-diversificacao-v0473
