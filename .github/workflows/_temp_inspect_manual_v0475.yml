name: TEMP inspeciona manual v0.47.5
on:
  push:
    branches: [fix-manual-multijogo-v0475]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-manual-multijogo-v0475
      - name: Mapear UI e geração manual
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py')
          s=p.read_text(encoding='utf-8')
          tree=ast.parse(s)
          wanted={
            'play_show_new','play_manual_input','play_render_generation','play_add_to_ticket',
            'play_method_changed','play_kind_changed','play_family_changed','play_variant_changed',
            'play_scope_changed','play_target_changed','play_refresh_method_ui','play_clear_generation',
            '_set_play_subnav_active','_draft_description','show_play_page'
          }
          for node in ast.walk(tree):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and (node.name in wanted or ('play_' in node.name and any(x in node.name for x in ('kind','method','family','variant','ticket','generation')))):
                  seg=ast.get_source_segment(s,node) or ''
                  print(f'\n===== {node.name} L{node.lineno} =====')
                  print(seg[:40000])
          PY
