name: Auditoria estrutural v0.41.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-v0.41.0.yml"
      - ".github/scripts/audit_v0410.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar estrutura atual
        run: python .github/scripts/audit_v0410.py
