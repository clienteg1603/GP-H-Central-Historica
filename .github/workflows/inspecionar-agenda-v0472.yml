name: Inspecionar agenda v0.47.2
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear agenda e próxima rodada
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py')
          s=p.read_text(encoding='utf-8')
          t=ast.parse(s)
          terms=('next_round','proxima','próxima','round','rodada','federal','domingo','quarta','sábado','sabado','ptn','21:00','18:00')
          for node in ast.walk(t):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  seg=ast.get_source_segment(s,node) or ''
                  low=(node.name+' '+seg).lower()
                  if any(x in low for x in terms) and any(x in low for x in ('rodada','round','federal','ptn')):
                      print(f'\n===== {node.name} L{node.lineno} =====')
                      print(seg[:26000])
          print('\n=== CONSTANTES/LINHAS ===')
          for i,line in enumerate(s.splitlines(),1):
              low=line.lower()
              if any(x in low for x in ('federal','ptn 18','18:00','21:00','domingo','quarta','sábado','sabado')):
                  print(f'{i}: {line[:500]}')
          PY
