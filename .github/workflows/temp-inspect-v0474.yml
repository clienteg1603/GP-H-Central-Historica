name: TEMP inspect v0.47.4
on:
  push:
    paths: ['.github/workflows/temp-inspect-v0474.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8')
          t=ast.parse(s)
          names={'generate_historical_numbers','generate_inverted_numbers','generate_dezena_combinations','generate_passe_combinations','play_method_changed','show_play_page','play_generate'}
          for node in ast.walk(t):
            if isinstance(node,ast.FunctionDef) and node.name in names:
              seg=ast.get_source_segment(s,node) or ''
              print(f'\n===== {node.name} L{node.lineno}-{getattr(node,"end_lineno",0)} =====')
              print(seg[:65000])
          lines=s.splitlines()
          for needle in ('play_meta_animals','play_method =','play_method.configure','play_method[','play_method_combo','Combobox'):
            print('\n### OCCURRENCES',needle)
            for i,line in enumerate(lines,1):
              if needle in line:
                a=max(1,i-15); b=min(len(lines),i+25)
                print(f'--- {a}-{b} ---')
                for j in range(a,b+1): print(f'{j}: {lines[j-1]}')
          PY
