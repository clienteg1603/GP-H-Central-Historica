name: Polimento geral v0.38.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-v0.38.0.yml"
      - ".github/scripts/patch_v0380.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar v0.38.0
        run: python .github/scripts/patch_v0380.py
      - name: Validar Python e invariantes
        run: |
          python -m py_compile source/gph_central.py
          python - <<'PY'
          from pathlib import Path
          import ast
          text=Path('source/gph_central.py').read_text(encoding='utf-8')
          ast.parse(text)
          assert 'APP_VERSION = "0.38.0"' in text
          assert '"Base / Configurações"' not in text
          assert '"Configurações", self.show_base_config' in text
          assert 'def _base_scroll_to(self, key):' in text
          assert 'text="Guia dos métodos"' in text
          assert 'text="BUSCAR NOVA VERSÃO"' in text
          assert text.count('text="Atualizar resultados"') >= 2
          assert 'def generate_centenas_3plus1(' in text
          assert 'def centena_31_freeze_state(' in text
          assert 'def decision_contextual_evidence(' in text
          assert 'def method_reset_coverage_v1(' in text
          assert 'def play_generate(' in text
          print('VALIDAÇÃO v0.38.0 OK')
          PY
      - name: Registrar v0.38.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --stat
          git commit -m "v0.38.0 polimento geral das telas"
          git push origin main
