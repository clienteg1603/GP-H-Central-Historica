name: Estudo Meta + Tabela 1
on:
  push:
    branches: [study-meta-table1]
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study-meta-table1
      - name: Preparar ambiente
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
      - name: Validar fonte atual
        run: python -m py_compile source/gph_central.py _study_meta_table1.py
      - name: Rodar admissão da Tabela 1
        run: python -u _study_meta_table1.py
      - name: Mostrar resultado final
        if: always()
        run: |
          if [ -f _study_meta_table1_result.json ]; then
            cat _study_meta_table1_result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-table1-study-result
          path: _study_meta_table1_result.json
          if-no-files-found: ignore
