name: Reforma GP-H - Etapa 4 temporaria

on:
  push:
    branches:
      - refactor-ui-limpeza-v045
    paths:
      - ".github/workflows/refactor-stage4-temp.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-ui-limpeza-v045
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Polir menu lateral e reduzir popups redundantes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path=Path('source/gph_central.py')
          text=path.read_text(encoding='utf-8')
          before_tree=ast.parse(text)

          def sensitive_map(tree):
              tokens=('meta','reset','similar','convergencia','historico_concentrado','decision_contextual','decision_operational_recommendation')
              return {
                  n.name:ast.dump(n,include_attributes=False)
                  for n in ast.walk(tree)
                  if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))
                  and any(t in n.name.lower() for t in tokens)
              }
          sensitive_before=sensitive_map(before_tree)

          # Menu: explicitar os tres blocos em vez de depender apenas de linhas.
          old='''        # Uso diário primeiro; estudos ficam em um segundo bloco.\n        for label, command, icon_key in [\n'''
          new='''        # Uso diario primeiro; analises e sistema ficam claramente separados.\n        self._add_sidebar_section_label("OPERAÇÃO")\n        for label, command, icon_key in [\n'''
          if text.count(old)!=1: raise SystemExit('Inicio do menu nao localizado')
          text=text.replace(old,new,1)

          first_div='''        tk.Frame(self.sidebar, bg=self.colors["divider"], height=1).pack(\n            fill="x", padx=14, pady=12\n        )\n\n        for label, command, icon_key in [\n            ("Pesquisa", self.show_search, "search"),\n'''
          first_new='''        tk.Frame(self.sidebar, bg=self.colors["divider"], height=1).pack(\n            fill="x", padx=14, pady=(10, 7)\n        )\n        self._add_sidebar_section_label("ANÁLISE")\n\n        for label, command, icon_key in [\n            ("Pesquisa", self.show_search, "search"),\n'''
          if text.count(first_div)!=1: raise SystemExit('Divisor Analise nao localizado')
          text=text.replace(first_div,first_new,1)

          second_div='''        tk.Frame(self.sidebar, bg=self.colors["divider"], height=1).pack(\n            fill="x", padx=14, pady=12\n        )\n\n        self._add_nav_button(\n            "Configurações", self.show_base_config, secondary=True, icon_key="database"\n        )\n'''
          second_new='''        tk.Frame(self.sidebar, bg=self.colors["divider"], height=1).pack(\n            fill="x", padx=14, pady=(10, 7)\n        )\n        self._add_sidebar_section_label("SISTEMA")\n\n        self._add_nav_button(\n            "Configurações", self.show_base_config, secondary=True, icon_key="database"\n        )\n'''
          if text.count(second_div)!=1: raise SystemExit('Divisor Sistema nao localizado')
          text=text.replace(second_div,second_new,1)

          marker='''    def _add_nav_button(self, label, command, secondary=False, icon_key=None):\n'''
          helper='''    def _add_sidebar_section_label(self, text):\n        tk.Label(\n            self.sidebar,\n            text=text,\n            bg=self.colors["sidebar"],\n            fg=self.colors["muted"],\n            font=(UI_FONT_SEMIBOLD, 8),\n            anchor="w",\n        ).pack(fill="x", padx=18, pady=(0, 4))\n\n'''
          if text.count(marker)!=1: raise SystemExit('_add_nav_button nao localizado')
          text=text.replace(marker,helper+marker,1)

          old_font='''            font=("Segoe UI", 9 if secondary else 10),\n'''
          new_font='''            font=(UI_FONT_FAMILY, UI_FONT_SIZES["body"]),\n'''
          if text.count(old_font)!=1: raise SystemExit('Fonte do menu nao localizada')
          text=text.replace(old_font,new_font,1)

          # Preparar varios horarios ja recebe feedback na barra de status.
          # O showinfo seguinte obrigava um clique sem acrescentar decisao.
          redundant='''        messagebox.showinfo(\n            "Horários preparados",\n            (\n                f"{len(selected)} rodada(s) foram adicionadas ao bilhete em montagem.\\n\\n"\n                "Nenhum bilhete foi registrado ainda.\\n"\n                "Revise o bilhete e clique em REGISTRAR BILHETE quando quiser confirmar."\n            ),\n            parent=self,\n        )\n\n'''
          if text.count(redundant)!=1: raise SystemExit('Popup Horarios preparados nao localizado')
          text=text.replace(redundant,'',1)

          # Depois do askyesno financeiro, sucesso passa a aparecer na barra e
          # a propria tela Bilhetes confirma visualmente o registro.
          success_block='''        if multi_targets:\n            messagebox.showinfo(\n                "Bilhetes registrados",\n                (\n                    f"{len(registered)} bilhetes separados foram registrados.\\n"\n                    f"{len(game_ids)} modalidade(s) no total.\\n"\n                    f"Total apostado: {self._money(grand_total)}."\n                ),\n                parent=self,\n            )\n        else:\n            messagebox.showinfo(\n                "Bilhete registrado",\n                (\n                    f"Bilhete #{registered[0]} registrado.\\n"\n                    f"{len(game_ids)} modalidade(s).\\n"\n                    f"Total apostado: {self._money(total_per_ticket)}."\n                ),\n                parent=self,\n            )\n\n        self.play_show_games(\n'''
          success_new='''        if multi_targets:\n            self.status.configure(\n                text=(\n                    f"{len(registered)} bilhetes registrados • "\n                    f"{len(game_ids)} modalidade(s) • total {self._money(grand_total)}."\n                )\n            )\n        else:\n            self.status.configure(\n                text=(\n                    f"Bilhete #{registered[0]} registrado • "\n                    f"{len(game_ids)} modalidade(s) • total {self._money(total_per_ticket)}."\n                )\n            )\n\n        self.play_show_games(\n'''
          if text.count(success_block)!=1: raise SystemExit('Popup de registro nao localizado')
          text=text.replace(success_block,success_new,1)

          # Excluir continua exigindo confirmacao; apenas o popup de sucesso e
          # substituido por feedback na barra inferior.
          delete_block='''        if not report.get("deleted"):\n            messagebox.showinfo(\n                "Excluir bilhete",\n                "Esse bilhete já não existe na base.",\n                parent=self,\n            )\n        else:\n            messagebox.showinfo(\n                "Bilhete excluído",\n                (\n                    f"Bilhete #{ticket_id} excluído.\\n"\n                    f"{report.get('games_deleted', 0)} modalidade(s) removida(s)."\n                ),\n                parent=self,\n            )\n\n        self.play_selected_ticket_id = None\n'''
          delete_new='''        if not report.get("deleted"):\n            feedback = f"Bilhete #{ticket_id} já não existe na base."\n        else:\n            feedback = (\n                f"Bilhete #{ticket_id} excluído • "\n                f"{report.get('games_deleted', 0)} modalidade(s) removida(s)."\n            )\n\n        self.play_selected_ticket_id = None\n'''
          if text.count(delete_block)!=1: raise SystemExit('Feedback de exclusao nao localizado')
          text=text.replace(delete_block,delete_new,1)
          old_status='''        self.status.configure(text=f"Bilhete #{ticket_id} excluído.")\n'''
          new_status='''        self.status.configure(text=feedback)\n'''
          if text.count(old_status)!=1: raise SystemExit('Status exclusao nao localizado')
          text=text.replace(old_status,new_status,1)

          after_tree=ast.parse(text)
          if sensitive_map(after_tree)!=sensitive_before:
              raise SystemExit('ABORTADO: cerebro sensivel alterado')
          path.write_text(text,encoding='utf-8')
          print('Etapa 4 aplicada; cerebro sensivel preservado.')
          PY

      - name: Validar Etapa 4
        shell: bash
        run: |
          python -m py_compile source/gph_central.py source/gph_updater.py
          python - <<'PY'
          from pathlib import Path
          import ast
          text=Path('source/gph_central.py').read_text(encoding='utf-8')
          tree=ast.parse(text)
          funcs={n.name for n in ast.walk(tree) if isinstance(n,ast.FunctionDef)}
          assert '_add_sidebar_section_label' in funcs
          for label in ('OPERAÇÃO','ANÁLISE','SISTEMA'):
              assert f'_add_sidebar_section_label("{label}")' in text
          assert '"Horários preparados"' not in text
          assert 'feedback = f"Bilhete #{ticket_id} já não existe na base."' in text
          assert 'font=(UI_FONT_FAMILY, UI_FONT_SIZES["body"])' in text
          print('Menu lateral OK')
          print('Feedback sem popup redundante OK')
          PY
          git diff --check
          git diff --stat

      - name: Gravar Etapa 4 na branch de reforma
        shell: bash
        run: |
          git config user.name "Gzaraki"
          git config user.email "112765179+clienteg1603@users.noreply.github.com"
          git rm .github/workflows/refactor-stage4-temp.yml
          git add source/gph_central.py
          git commit -m "Etapa 4: polir menu e feedback de uso"
          git push origin HEAD:refactor-ui-limpeza-v045
