name: TEMP inspect coverage v0.47.8
on:
  push:
    branches: [fix-coverage-history-v0477]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant methods
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('source/gph_central.py')
          text=p.read_text(encoding='utf-8')
          tree=ast.parse(text)
          lines=text.splitlines()
          wanted={
            '_decision_audited_rows','_decision_row_to_dict','decision_coverage_evolution',
            'audit_decision_snapshots','_find_result_for_target','_result_groups_for_target',
            'get_results','find_result','latest_result','_normalize_draw_name'
          }
          for node in ast.walk(tree):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name in wanted:
                  print('\n'+'='*20+' '+node.name+' '+'='*20)
                  print('\n'.join(lines[node.lineno-1:node.end_lineno]))
          print('\n=== RESULTADOS TABLE REFERENCES ===')
          for i,line in enumerate(lines,1):
              if ('CREATE TABLE' in line and 'resultado' in line.lower()) or ('FROM resultados' in line) or ('JOIN resultados' in line):
                  print(i, line[:220])
          print('\n=== DECISION SNAPSHOTS TABLE REFERENCES ===')
          for i,line in enumerate(lines,1):
              if 'decision_snapshots' in line and ('CREATE TABLE' in line or 'SELECT ' in line or 'UPDATE ' in line or 'INSERT ' in line):
                  print(i, line[:260])
          PY
