name: Auditoria visual e estrutural v0.37.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auditoria-ui-v0.37.0.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar duplicidades e estruturas legadas
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, collections, re

          text=Path('source/gph_central.py').read_text(encoding='utf-8')
          lines=text.splitlines()
          tree=ast.parse(text)

          print('=== CLASSES DE INTERFACE ===')
          classes=[]
          for node in tree.body:
              if isinstance(node,ast.ClassDef):
                  classes.append((node.lineno,node.end_lineno,node.name))
          for a,b,n in classes:
              if a>=9500:
                  refs=[i for i,l in enumerate(lines,1) if re.search(rf'\b{re.escape(n)}\b',l)]
                  print(f'{n}: linhas {a}-{b}; referencias={refs}')

          print('\n=== ROTAS / METODOS LEGADOS IMPORTANTES ===')
          targets=['show_generator_page','show_shadow_lab_page','show_base','show_methods_page','show_pulls_page','show_statistics_page','show_play_page','show_decision_page']
          for target in targets:
              refs=[]
              for i,l in enumerate(lines,1):
                  if target in l:
                      refs.append((i,l.strip()))
              print('\n',target)
              for i,l in refs: print(f'{i}: {l}')

          print('\n=== METODOS DE PAGINA E TAMANHO ===')
          funcs=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.FunctionDef) and node.name.startswith('show_'):
                  funcs.append((node.lineno,node.end_lineno,node.name,node.end_lineno-node.lineno+1))
          for a,b,n,size in sorted(funcs):
              if a>=14000:
                  print(f'{n}: {a}-{b} ({size} linhas)')

          print('\n=== CRIACAO DE TOPLEVELS ===')
          for i,l in enumerate(lines,1):
              if 'Toplevel(' in l or '.geometry(' in l:
                  if i>=13000:
                      print(f'{i}: {l.strip()}')

          print('\n=== ESTILOS TTK DECLARADOS ===')
          styles=collections.Counter()
          for m in re.finditer(r'style\.configure\([\"\']([^\"\']+)',text):
              styles[m.group(1)]+=1
          for n,c in sorted(styles.items()): print(c,n)

          print('\n=== ESTILOS USADOS EXPLICITAMENTE ===')
          used=collections.Counter(re.findall(r'style=[\"\']([^\"\']+)[\"\']',text))
          for n,c in used.most_common(): print(c,n)

          print('\n=== POSSIVEIS FONTES MINUSCULAS ===')
          for i,l in enumerate(lines,1):
              m=re.search(r'font=\([^\)]*,\s*(\d+)',l)
              if m and int(m.group(1))<=7:
                  print(f'{i}: {l.strip()}')

          print('\n=== PAGINAS COM SCROLL PADRAO ===')
          for i,l in enumerate(lines,1):
              if '_make_scrollable_page_body(self.content' in l:
                  print(f'{i}: {l.strip()}')
          PY
