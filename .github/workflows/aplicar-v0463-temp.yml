name: Aplicar v0.46.3 Sync WinError 5

on:
  push:
    branches:
      - fix-sync-winerror5-v0463
    paths:
      - "tmp_v0463_patch.py"
      - "tmp_v0463_test.py"
      - ".github/workflows/aplicar-v0463-temp.yml"

permissions:
  contents: write

jobs:
  validar-e-aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: fix-sync-winerror5-v0463
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Guardar baseline v0.46.2
        run: git show origin/main:source/gph_central.py > /tmp/gph_main_v0462.py

      - name: Aplicar patch v0.46.3
        run: python tmp_v0463_patch.py

      - name: Validar sintaxe
        run: python -m py_compile source/gph_central.py source/gph_updater.py

      - name: Testar WinError 5 e proteção do Database
        run: python tmp_v0463_test.py

      - name: Conferir diff
        run: git diff --check

      - name: Gravar versão validada e limpar temporários
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git rm -f tmp_v0463_patch.py tmp_v0463_test.py .github/workflows/aplicar-v0463-temp.yml
          git commit -m "v0.46.3 Corrigir sync WinError 5"
          git push
