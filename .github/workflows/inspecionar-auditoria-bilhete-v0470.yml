name: Inspecionar auditoria e bilhete v0.47.0
on:
  push:
    branches: [ui-auditoria-bilhete-v0470]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-auditoria-bilhete-v0470
      - name: Mostrar construtor e schema relevante
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('source/gph_central.py').read_text(encoding='utf-8')
          t=ast.parse(s)
          for node in ast.walk(t):
              if isinstance(node,ast.ClassDef) and node.name=='Database':
                  for item in node.body:
                      if isinstance(item,(ast.FunctionDef,ast.AsyncFunctionDef)) and item.name in {'__init__','init_schema','refresh_ticket_totals','delete_ticket'}:
                          print(f'\n===== {item.name} L{item.lineno} =====')
                          seg=ast.get_source_segment(s,item) or ''
                          if item.name=='init_schema':
                              for line in seg.splitlines():
                                  if any(x in line.lower() for x in ['create table','bilhetes','jogos_congelados','jogos_itens','sync_uid','foreign key']):
                                      print(line)
                          else:
                              print(seg)
          PY
