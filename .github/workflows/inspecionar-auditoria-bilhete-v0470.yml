name: Aplicar auditoria e bilhete v0.47.0
on:
  push:
    branches: [ui-auditoria-bilhete-v0470]
permissions:
  contents: write
jobs:
  aplicar:
    if: github.event.head_commit.message == 'Executa correção auditoria e bilhete v0.47.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-auditoria-bilhete-v0470
          fetch-depth: 0
      - name: Preparar ambiente e baseline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          cp source/gph_central.py /tmp/gph_v0469_before.py
      - name: Aplicar patch
        run: python _temp_patch_v0470.py
      - name: Validar Python e comportamento
        run: |
          python -m py_compile source/gph_central.py
          python _temp_test_v0470.py
      - name: Conferir diff final
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Limpar temporários e salvar versão validada
        run: |
          rm -rf source/__pycache__ __pycache__
          git rm .github/workflows/inspecionar-auditoria-bilhete-v0470.yml _temp_patch_v0470.py _temp_test_v0470.py
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v0.47.0 Auditoria automática e exclusão parcial de bilhete'
          git push origin HEAD:ui-auditoria-bilhete-v0470
