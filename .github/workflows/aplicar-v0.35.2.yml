name: Aplicar evolução v0.35.2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/aplicar-v0.35.2.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar v0.35.2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('source/gph_central.py')
          text = app.read_text(encoding='utf-8')

          if 'APP_VERSION = "0.35.1"' not in text:
              raise SystemExit('Versão-base 0.35.1 não encontrada')
          text = text.replace('GP-H Central Histórica v0.35.1', 'GP-H Central Histórica v0.35.2', 1)
          text = text.replace('APP_VERSION = "0.35.1"', 'APP_VERSION = "0.35.2"', 1)

          marker = '''        # Três blocos principais: Centenas, Puxadas/Bichos e Seca 1º.\n'''
          if marker not in text:
              raise SystemExit('Ponto de inserção do Laboratório não encontrado')

          block = '''        # v0.35.2 — leitura atual congelada para a próxima rodada.\n        # Apenas apresenta os sinais já gravados prospectivamente; não altera métodos.\n        payload_now = current.get("payload") or {}\n        current_box = ttk.Frame(host, style="Card.TFrame", padding=10)\n        current_box.pack(fill="x", pady=(0,8))\n        ttk.Label(current_box, text="LEITURA ATUAL CONGELADA", style="CardTitle.TLabel").pack(anchor="w")\n        ttk.Label(\n            current_box,\n            text="Sinais que já estavam congelados para esta rodada antes do resultado. A convergência abaixo é somente contagem transparente entre métodos disponíveis.",\n            style="CardMuted.TLabel", wraplength=1050,\n        ).pack(anchor="w", pady=(2,6))\n\n        def _shadow_fmt_groups(values):\n            out=[]\n            for raw in values or []:\n                try:\n                    g=int(raw)\n                except Exception:\n                    continue\n                if 1 <= g <= 25:\n                    out.append(f"{g:02d} {BICHOS.get(g, str(g)).title()}")\n            return " • ".join(out) if out else "Sem leitura disponível"\n\n        bichos_now = payload_now.get("bichos") or {}\n        method_sets = []\n        for method_name in ("Reset Cobertura", "Puxada Combinada", "Similaridade"):\n            method_payload = bichos_now.get(method_name) or {}\n            groups_now = []\n            for raw in method_payload.get("groups") or []:\n                try:\n                    g=int(raw)\n                except Exception:\n                    continue\n                if 1 <= g <= 25 and g not in groups_now:\n                    groups_now.append(g)\n            groups_now = groups_now[:5]\n            if groups_now:\n                method_sets.append((method_name, set(groups_now)))\n                ttk.Label(\n                    current_box,\n                    text=f"{method_name}: {_shadow_fmt_groups(groups_now)}",\n                    style="Card.TLabel", wraplength=1050, justify="left",\n                ).pack(anchor="w", pady=(1,0))\n            else:\n                ttk.Label(\n                    current_box,\n                    text=f"{method_name}: Sem leitura disponível",\n                    style="CardMuted.TLabel", wraplength=1050, justify="left",\n                ).pack(anchor="w", pady=(1,0))\n\n        convergence = Counter()\n        for _method_name, group_set in method_sets:\n            convergence.update(group_set)\n        shared = sorted(\n            ((g,c) for g,c in convergence.items() if c >= 2),\n            key=lambda item: (-item[1], item[0]),\n        )\n        available_methods = len(method_sets)\n        if shared:\n            conv_text = " • ".join(\n                f"{g:02d} {BICHOS.get(g, str(g)).title()} ({count}/{available_methods})"\n                for g,count in shared\n            )\n        elif available_methods >= 2:\n            conv_text = "Nenhum bicho apareceu em pelo menos 2 métodos nesta leitura."\n        else:\n            conv_text = "Ainda não há métodos suficientes disponíveis para medir convergência."\n        ttk.Label(\n            current_box,\n            text=f"Convergência: {conv_text}",\n            style="CardMuted.TLabel", wraplength=1050, justify="left",\n        ).pack(anchor="w", pady=(5,0))\n\n        dry_now = ((payload_now.get("seca_1p") or {}).get("Seca do Dia 1º") or {})\n        dry_groups_now = []\n        for raw in dry_now.get("groups") or []:\n            try:\n                g=int(raw)\n            except Exception:\n                continue\n            if 1 <= g <= 25 and g not in dry_groups_now:\n                dry_groups_now.append(g)\n        ttk.Label(\n            current_box,\n            text=f"Seca do Dia • 1º prêmio: {_shadow_fmt_groups(dry_groups_now[:5])}",\n            style="Card.TLabel" if dry_groups_now else "CardMuted.TLabel",\n            wraplength=1050, justify="left",\n        ).pack(anchor="w", pady=(5,0))\n\n'''

          if 'LEITURA ATUAL CONGELADA' not in text:
              text = text.replace(marker, block + marker, 1)

          app.write_text(text, encoding='utf-8')

          updates = Path('source/ATUALIZACOES_PROGRAMA_v0.35.txt')
          u = updates.read_text(encoding='utf-8')
          u = u.replace('GP-H CENTRAL HISTÓRICA v0.35.1 — ATUALIZAÇÕES DO PROGRAMA', 'GP-H CENTRAL HISTÓRICA v0.35.2 — ATUALIZAÇÕES DO PROGRAMA', 1)
          old = 'Novidades v0.35.1:\n'
          new = (
              'Novidades v0.35.2:\n'
              '- Laboratório Sombra passa a mostrar a leitura atual já congelada da próxima rodada.\n'
              '- Exibe os 5 bichos atuais de Reset Cobertura, Puxada Combinada e Similaridade.\n'
              '- Mostra convergência transparente entre os métodos disponíveis, sem criar desempates artificiais.\n'
              '- Exibe separadamente a Seca do Dia focada exclusivamente no 1º prêmio.\n'
              '- Nenhum método, fórmula ou jogo oficial foi alterado.\n\n'
              'Novidades v0.35.1:\n'
          )
          if old not in u:
              raise SystemExit('Bloco de novidades v0.35.1 não encontrado')
          u = u.replace(old, new, 1)
          updates.write_text(u, encoding='utf-8')

          docs = Path('source/DOCUMENTACAO_GP-H.txt')
          d = docs.read_text(encoding='utf-8')
          revision = (
              'REVISÃO v0.35.2 — LEITURA ATUAL / CONVERGÊNCIA DO LABORATÓRIO\n'
              '- O Laboratório Sombra mostra os sinais atuais já congelados para a próxima rodada.\n'
              '- Reset Cobertura, Puxada Combinada e Similaridade aparecem com seus 5 bichos atuais.\n'
              '- A convergência é contada de forma transparente entre métodos disponíveis; empates permanecem empates.\n'
              '- A Seca do Dia continua separada e exclusivamente voltada ao 1º prêmio.\n'
              '- Nenhum método, fórmula, histórico ou jogo oficial foi alterado.\n\n'
          )
          if not d.startswith('REVISÃO v0.35.2'):
              d = revision + d
          d = d.replace('VERSÃO ATUAL: v0.35.1', 'VERSÃO ATUAL: v0.35.2', 1)
          docs.write_text(d, encoding='utf-8')
          PY

          python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py

      - name: Publicar alteração e remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/aplicar-v0.35.2.yml
          git add -A
          git commit -m "Evolui Laboratório Sombra para v0.35.2"
          git push
