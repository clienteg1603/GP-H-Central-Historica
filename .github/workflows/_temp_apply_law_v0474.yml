name: TEMP aplicar Lei GP-H v0.47.4
on:
  push:
    branches: [feature-lei-geracao-meta-tabela1-v0474]
permissions:
  contents: write
jobs:
  apply-law:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-lei-geracao-meta-tabela1-v0474
          fetch-depth: 0
      - name: Preparar ambiente
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          cp source/gph_central.py /tmp/gph_before_v0474.py
      - name: Aplicar Lei GP-H
        run: python _temp_patch_law_v0474.py
      - name: Validar fonte e comportamento
        run: |
          python -m py_compile source/gph_central.py
          python _temp_validate_law_v0474.py
          git diff --check
      - name: Salvar versão validada e limpar auxiliares desta etapa
        run: |
          rm -rf source/__pycache__ __pycache__
          git rm .github/workflows/_temp_apply_law_v0474.yml
          git rm .github/workflows/_temp_inspect_dry_v0474.yml || true
          git rm _temp_patch_law_v0474.py _temp_validate_law_v0474.py
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v0.47.4 Lei de Geracao GP-H universal'
          git push origin HEAD:feature-lei-geracao-meta-tabela1-v0474
