name: TEMP inspeciona Evolução de Cobertura v0.47.6
on:
  push:
    branches: [feat-evolucao-cobertura-v0476]
permissions:
  contents: write
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip-inspect]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-evolucao-cobertura-v0476
      - name: Extrair jogos congelados e Ternos
        run: |
          sed -n '1180,1490p' source/gph_central.py > _ctx_games_schema_v0476.txt
          grep -n -C 8 'jogos_congelados' source/gph_central.py > _ctx_games_queries_v0476.txt || true
          grep -n -C 10 'Terno de Grupo' source/gph_central.py > _ctx_ternos_v0476.txt || true
          grep -n -C 8 'seletor' source/gph_central.py > _ctx_seletor_v0476.txt || true
      - name: Persistir inspeção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _ctx_games_schema_v0476.txt _ctx_games_queries_v0476.txt _ctx_ternos_v0476.txt _ctx_seletor_v0476.txt
          git commit -m "TEMP fonte prospectiva dos Ternos [skip-inspect]" || exit 0
          git push
