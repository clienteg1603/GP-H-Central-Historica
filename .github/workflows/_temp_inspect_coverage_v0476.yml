name: TEMP valida Evolução de Cobertura v0.47.6
on:
  push:
    branches: [feat-evolucao-cobertura-v0476]
permissions:
  contents: write
jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[coverage-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-evolucao-cobertura-v0476
          fetch-depth: 0
      - name: Preparar ambiente e baseline
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk
          cp source/gph_central.py /tmp/gph_before_coverage_v0476.py
      - name: Aplicar Evolução de Cobertura
        run: python _temp_patch_coverage_v0476.py
      - name: Validar código e isolamento do Meta
        run: |
          python -m py_compile source/gph_central.py source/gph_updater.py source/CRIAR_PACOTE_ATUALIZACAO.py
          python _temp_test_coverage_v0476.py
          git diff --check
      - name: Conferir alterações funcionais
        run: |
          git diff -- source/gph_central.py source/DOCUMENTACAO_GP-H.txt
      - name: Limpar temporários e salvar versão validada
        run: |
          rm -rf source/__pycache__ __pycache__
          git rm -f .github/workflows/_temp_inspect_coverage_v0476.yml
          git rm -f _temp_patch_coverage_v0476.py _temp_test_coverage_v0476.py _temp_inspect_coverage_v0476.py
          git rm -f _inspection_v0476.txt || true
          git rm -f _ctx_*_v0476.txt || true
          git add source/gph_central.py source/DOCUMENTACAO_GP-H.txt
          if find . -path './.git' -prune -o -type f \( -name '_temp*' -o -name '_ctx*' -o -name '_inspection*' \) -print | grep -q .; then
            echo 'ERRO: arquivos temporários restantes:'
            find . -path './.git' -prune -o -type f \( -name '_temp*' -o -name '_ctx*' -o -name '_inspection*' \) -print
            exit 1
          fi
          git diff --cached --check
          echo '=== DIFF FINAL ==='
          git diff --cached --stat
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v0.47.6 Evolução de Cobertura [coverage-final]'
          git push origin HEAD:feat-evolucao-cobertura-v0476
