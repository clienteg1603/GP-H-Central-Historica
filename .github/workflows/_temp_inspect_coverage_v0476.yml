name: TEMP inspeciona Evolução de Cobertura v0.47.6
on:
  push:
    branches: [feat-evolucao-cobertura-v0476]
permissions:
  contents: write
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip-inspect]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-evolucao-cobertura-v0476
      - name: Extrair trechos exatos
        run: |
          sed -n '1580,2200p' source/gph_central.py > _ctx_decision_core_v0476.txt
          sed -n '4200,4450p' source/gph_central.py > _ctx_decision_audit_v0476.txt
          sed -n '23250,24280p' source/gph_central.py > _ctx_decision_ui_v0476.txt
          sed -n '24280,24980p' source/gph_central.py > _ctx_decision_ui2_v0476.txt
      - name: Persistir trechos no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _ctx_decision_core_v0476.txt _ctx_decision_audit_v0476.txt _ctx_decision_ui_v0476.txt _ctx_decision_ui2_v0476.txt
          git commit -m "TEMP trechos exatos Decisão v0.47.6 [skip-inspect]" || exit 0
          git push
