name: TEMP validar UI v0.48.6

on:
  push:
    branches:
      - feat-ui-foundation-v0486

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compilar fontes
        shell: pwsh
        run: |
          Set-Location source
          python -m py_compile gph_central.py gph_bootstrap.py gph_version.py gph_profile_recovery.py gph_round_advisor.py gph_round_advisor_guard.py gph_ui_foundation.py gph_ui_components.py gph_updater.py gph_history_lab.py gph_history_ui.py CRIAR_PACOTE_ATUALIZACAO.py
      - name: Rodar testes
        shell: pwsh
        run: |
          Set-Location source
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam" }
      - name: Testar build Windows sem console
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          Set-Location source
          python -m PyInstaller --clean --noconfirm "GP-H_Central.spec"
          if (-not (Test-Path "dist\GP-H Central Historica.exe")) { throw "Executável principal não foi gerado" }
